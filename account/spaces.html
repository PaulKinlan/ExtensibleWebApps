<!--
  Your spaces (spaces.js). It sends { user, spaces, app, invite, status,
  revision }: each space { name, owner, role, open, hasMembers, members },
  where `open` is the address of the app the person came from, in that space,
  and `members` lists who is in it with their role (owner, member or viewer).
  `invite` is the last invite link made.
-->
<style>
  .spaces { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }
  .spaces form { display: flex; flex-direction: row; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  .spaces input { flex: 1 1 12rem; }
  .spaces ul { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-3); padding: 0; list-style: none; }
  .spaces .space-list > li { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); overflow-wrap: anywhere; }
  .spaces li .actions { display: flex; flex-direction: row; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .spaces li .actions a:not(.button) { margin-right: var(--space-2); }
  .spaces .member-list { gap: var(--space-2); }
  .spaces .member-row { display: flex; flex-direction: row; flex-wrap: wrap; gap: var(--space-2); align-items: center; font-size: var(--text-sm); color: var(--fg-2); }
  .spaces .status:empty { display: none; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<template id="spaces">
  <template if="user">
    <section class="spaces">
      <h2>Your spaces</h2>
      <p>A space holds people and their data, and any app can open in it. One with just you in it is your own.</p>
      <ul class="space-list">
        <template for="s of spaces">
          <li key="{{s.name}}">
            <span><strong>{{s.name}}</strong> ({{s.role}})</span>
            <span class="actions">
              <template if="s.open"><a href="{{s.open}}">Open {{app.title}} in it</a></template>
              <a href="/s/{{s.name}}/">Open the site in it</a>
            </span>
            <template if="s.hasMembers">
              <ul class="member-list">
                <template for="m of s.members">
                  <li key="{{m.id}}" class="member-row">
                    <span>{{m.name}} ({{m.role}})</span>
                    <template if="m.editable">
                      <label for="member-role-{{s.name}}-{{m.id}}" class="visually-hidden">Role for {{m.name}} in {{s.name}}</label>
                      <select id="member-role-{{s.name}}-{{m.id}}" data-action="role:{{s.name}}:{{m.id}}">
                        <option value="member" selected="{{m.isMember}}">member</option>
                        <option value="viewer" selected="{{m.isViewer}}">viewer</option>
                      </select>
                    </template>
                  </li>
                </template>
              </ul>
            </template>
            <span class="actions">
              <template if="s.owner">
                <form data-action="invite:{{s.name}}">
                  <label for="invite-role-{{s.name}}" class="visually-hidden">Role to invite to {{s.name}}</label>
                  <select id="invite-role-{{s.name}}" name="role">
                    <option value="member">Member</option>
                    <option value="viewer">Viewer</option>
                  </select>
                  <button type="submit" class="secondary">Invite someone</button>
                </form>
                <a href="/auth/spaces/{{s.name}}/export" class="button">Download a copy</a>
                <button type="button" data-action="load:{{s.name}}">Load a copy</button>
              </template>
              <template if="!s.owner">
                <button type="button" data-action="leave:{{s.name}}">Leave</button>
              </template>
            </span>
          </li>
        </template>
        <template if="!spaces.length"><li>None yet.</li></template>
      </ul>
      <form data-action="make" key="new-space-{{revision}}">
        <label for="space-name" class="visually-hidden">The new space's name</label>
        <input id="space-name" name="name" placeholder="family" required pattern="[a-z0-9][a-z0-9\-]{0,62}" title="Lowercase letters, numbers and dashes">
        <button type="submit">Make a space</button>
      </form>
      <template if="invite">
        <p class="invite">Send this link to the person you're inviting. It works once, for a week: <input id="invite-url" readonly value="{{invite}}"></p>
      </template>
      <p class="status" role="status">{{status}}</p>
    </section>
  </template>
</template>
