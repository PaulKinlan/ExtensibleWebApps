<!doctype html>
<!--
  The docs: the Markdown files in this folder, read on the site. GitHub shows
  the same files, so there is one copy of each page and no build step.

  docs.js is the only plugin. It turns the address into a file
  (/docs/guide/agents is guide/agents.md, and a folder is its README.md) and
  draws it with <ui-markdown>, which also draws each ```mermaid block as a
  diagram (elements/ui-markdown.html). contents.md is the list of pages down
  the side; add a page there when you add one here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extensible Web Apps docs</title>
  <meta name="description" content="How to build web apps that the people using them can change: the guide, the security model, and the reference.">
  <link rel="stylesheet" href="/platform/host.css">
  <script type="module" src="/platform/host.js"></script>
  <link rel="plugin" href="docs.js">
  <style>
    body > header nav { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-left: auto; }
    body > header h1 a { color: inherit; text-decoration: none; }
    .docs { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 24px; padding: 16px; max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto; align-items: start; }
    .contents { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
    .contents summary { display: none; }
    .page { min-width: 0; }
    @media (max-width: 800px) {
      .docs { grid-template-columns: minmax(0, 1fr); }
      .contents { position: static; max-height: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; }
      .contents summary { display: list-item; cursor: pointer; font-weight: 600; }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="./">Extensible Web Apps docs</a></h1>
    <nav aria-label="Elsewhere">
      <a href="/">Home</a>
      <a href="/demos/">Demo apps</a>
      <a href="/workbench/">Workbench</a>
      <a href="https://github.com/PaulKinlan/ExtensibleWebApps">Code</a>
    </nav>
  </header>
  <div class="docs">
    <nav class="contents" aria-label="Contents">
      <details open>
        <summary>Contents</summary>
        <slot name="contents"><p><a href="./">Start here</a></p></slot>
      </details>
      <script>
        // On a narrow screen the contents start folded, so the page comes first.
        // Following a link there folds them again.
        const narrow = matchMedia("(max-width: 800px)");
        const contents = document.querySelector(".contents details");
        if (narrow.matches) contents.open = false;
        // On a wide screen they can't be folded (the summary is hidden), so widening opens them again.
        narrow.addEventListener("change", () => {
          if (!narrow.matches) contents.open = true;
        });
        contents.addEventListener("click", (event) => {
          if (narrow.matches && event.composedPath().some((el) => el instanceof HTMLAnchorElement)) contents.open = false;
        });
      </script>
    </nav>
    <main class="page">
      <slot name="page"><p>Loading the page…</p></slot>
    </main>
  </div>
</body>
</html>
