<!doctype html>
<!--
  An app with a plugin that runs on a space's server (tests/server/run.mjs):
  guard.js keeps the space's memos free of a word, for every device, with no
  app open anywhere. inbox.js answers public routes there, for a form on
  any site. notes.js is the browser's side, and never runs there.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Server plugin check</title>
  <link rel="plugin" href="guard.js">
  <link rel="plugin" href="inbox.js">
  <link rel="plugin" href="notes.js">
  <link rel="plugin" href="https://elsewhere.example/plugin.js">
</head>
<body><slot name="main"></slot></body>
</html>
