<!--
  The Customize panel. customize.js draws it: { open, reopen, tabs: { plugins,
  make, layout }, message, follow, space, inspect, arrange, busy, make } and
  then, while it is open, one tab at a time:

  - Plugins: query, here (every plugin on the page: { id, name, description,
    who, user, app, on, off, error, offHint, places, share, reach, reachTitle }), groups (what
    can be added, by kind: { kind, title, about, packages }), samples,
    registry, nothingFound. A package and a sample each say what they can do
    once on (can, the kernel's words for their permissions). Each place is { key, where, label, ok, fragile,
    locked, unlocked, movable, moved }.
  - Make: make { starters, started, spotLabel, chosenSpot, name, code, rev,
    ok, problem, permissions, status, saved, editorLinked }. It is drawn even
    while the panel is closed, so a draft being typed survives closing it.
  - Layout: layout { slots, parts, elements, noSlots, noParts }.

  Every button sends an action with the plugin's id (or "plugin/place") as
  its value. Buttons that start something on the page have data-close, so
  the panel gets out of the way.

  The panel sits in the app's page, and the page's own CSS beats a plugin's
  (src/host/plugin-styles.ts). So the markup keeps to classed <div>s rather
  than lists, which apps often style for their own content: an app's
  `li { display: flex }` must not lay out Customize.
-->
<style>
  .customize { display: grid; gap: var(--space-4); align-content: start; container-type: inline-size; min-width: 0; min-height: calc(min(85vh, 900px) - 6rem); line-height: 1.45; }
  .customize * { min-width: 0; }
  .customize h3 { margin: 0; font-size: var(--text-md); font-weight: 650; }
  .customize h4 { margin: 0; font-size: var(--text-md); font-weight: 600; }
  .customize p { margin: 0; }
  .customize .muted { color: var(--fg-2); font-size: var(--text-sm); }
  .customize .ok { color: var(--ok, var(--accent)); }
  .customize .error { color: var(--danger); font-size: var(--text-sm); }
  .customize code { font: var(--text-sm) var(--mono, monospace); overflow-wrap: anywhere; }
  .customize strong { overflow-wrap: anywhere; }

  /* The tabs and what just happened stay in sight while the panel scrolls. */
  .customize .top { position: sticky; top: calc(-1 * var(--space-4)); z-index: 2; display: grid; gap: var(--space-3); margin: calc(-1 * var(--space-2)) 0 0; padding: var(--space-2) 0 var(--space-1); background: var(--surface); }
  .customize .tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); }
  .customize .tabs button { all: unset; cursor: pointer; padding: var(--space-2) var(--space-3); font-weight: 600; font-size: var(--text-md); color: var(--fg-2); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .customize .tabs button:hover { color: var(--fg); }
  .customize .tabs button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .customize .tabs button:focus-visible { outline: 3px solid var(--ring, var(--accent)); outline-offset: -3px; border-radius: var(--radius-sm); }
  .customize .status { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
  .customize .status p { flex: 1 1 14rem; font-weight: 500; }
  .customize .status .buttons { display: flex; gap: var(--space-2); }

  .customize .section { display: grid; gap: var(--space-3); }
  .customize .section-head { display: grid; gap: var(--space-1); }
  .customize .account { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .customize .account p { flex: 1 1 14rem; margin: 0; }
  .customize .entries { display: grid; gap: var(--space-2); }
  .customize .entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2) var(--space-4); align-items: start; padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .customize .entry.off { border-style: dashed; background: var(--bg-2); }
  .customize .entry-main { display: grid; gap: var(--space-1); }
  .customize .head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); }
  .customize .head strong { font-size: var(--text-md); }
  .customize .entry-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-2); }
  .customize .entry-actions button { min-width: 6.5rem; }
  .customize .pill { display: inline-flex; align-items: center; font-size: var(--text-sm); line-height: 18px; font-weight: 600; padding: 0 var(--space-2); border-radius: 999px; background: var(--bg-2); color: var(--fg-2); border: 1px solid var(--border); white-space: nowrap; }
  .customize .pill.on { background: color-mix(in srgb, var(--ok, var(--accent)) 14%, transparent); color: var(--fg); border-color: color-mix(in srgb, var(--ok, var(--accent)) 45%, transparent); }
  .customize .pill.off { background: color-mix(in srgb, var(--warn, var(--fg-2)) 14%, transparent); color: var(--fg); border-color: color-mix(in srgb, var(--warn, var(--fg-2)) 45%, transparent); }
  .customize .hint { font-size: var(--text-sm); color: var(--fg); }
  .customize .places { display: grid; gap: var(--space-1); margin-top: var(--space-1); }
  .customize .place { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); font-size: var(--text-sm); }
  .customize .place button { height: var(--control-sm); padding: 0 var(--space-3); font-size: var(--text-sm); }
  .customize .note { font-size: var(--text-sm); color: var(--fg-2); }

  /* A view's submit buttons look primary by default; here only the one that finishes a step does. */
  .customize button[type="submit"]:not(.primary) { background: var(--surface); color: var(--fg); border-color: var(--border); }
  .customize button[type="submit"]:not(.primary):hover { background: var(--bg-2); }
  .customize .search input { width: 100%; }
  .customize .kind + .kind { margin-top: var(--space-2); }
  .customize .kind { display: grid; gap: var(--space-2); padding-left: var(--space-3); border-left: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }
  .customize .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
  .customize .row input { flex: 1 1 12rem; }
  .customize details { display: block; padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); }
  .customize details > :not(summary) { margin-top: var(--space-3); }
  .customize summary { cursor: pointer; font-size: var(--text-md); font-weight: 600; }
  /* What a plugin can do, folded under its row: one line until the person wants to read it. */
  .customize details.can { padding: 0; border: 0; border-radius: 0; }
  .customize details.can > summary { font-size: var(--text-sm); font-weight: 400; color: var(--fg-2); }
  .customize details.can > :not(summary) { margin-top: var(--space-1); }
  .customize textarea { width: 100%; font-family: var(--mono, monospace); }
  .customize .stack { display: grid; gap: var(--space-2); }

  /* Make */
  .customize .make { display: grid; gap: var(--space-3); }
  .customize .make[hidden] { display: none; }
  .customize .make form { display: grid; gap: var(--space-3); margin: 0; }
  .customize .step { display: grid; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius); }
  .customize .step > h3 { display: flex; align-items: center; gap: var(--space-2); }
  .customize .step > h3[data-step]::before { content: attr(data-step); flex: none; display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--accent); color: var(--accent-fg, #fff); font-size: var(--text-sm); }
  .customize .starters { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: var(--space-2); }
  .customize .starters button { display: grid; gap: 2px; align-content: start; justify-items: start; text-align: left; padding: var(--space-2) var(--space-3); min-height: 64px; height: auto; white-space: normal; line-height: 1.3; }
  .customize .starters button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
  .customize .starters small { color: var(--fg-2); font-weight: 400; font-size: var(--text-sm); }
  .customize label.field { display: grid; gap: var(--space-1); font-size: var(--text-sm); font-weight: 600; }
  .customize label.field input { font-weight: 400; }
  .customize .asks { display: grid; gap: 2px; padding-left: var(--space-3); font-size: var(--text-sm); }
  .customize .asks span::before { content: "· "; color: var(--fg-2); }
  .customize .tip { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius); background: var(--bg-2); }
  .customize .tip p { flex: 1 1 14rem; }

  /* Layout */
  .customize .layout { display: grid; gap: var(--space-5); }
  .customize .layout .section + .section { padding-top: var(--space-4); border-top: 1px solid var(--border); }
  .customize .layout dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-2) var(--space-4); font-size: var(--text-sm); }
  .customize .layout dt { font-weight: 600; }
  .customize .layout dd { margin: 0; color: var(--fg-2); }
  .customize .elements { display: grid; border-top: 1px solid var(--border); }
  .customize .elements details { padding: var(--space-2) 0; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; }
  .customize .elements details > :not(summary) { margin-top: var(--space-1); }
  .customize .mark-locked { color: var(--danger); }
  .customize .mark-review { color: var(--warn, var(--fg-2)); }

  @container (max-width: 520px) {
    .customize .entry { grid-template-columns: minmax(0, 1fr); }
    .customize .entry-actions { justify-content: flex-start; }
    .customize .tabs button { padding: var(--space-2); }
    .customize .step { padding: var(--space-3); }
    .customize .layout dl { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .customize .layout dd { margin-bottom: var(--space-2); }
  }
</style>
<template id="panel">
  <ui-panel label="Customize" toggle="panel" reopen="{{reopen}}">
    <div class="customize">
      <template if="open">
        <div class="top">
          <div class="tabs" role="toolbar" aria-label="Customize">
            <button type="button" data-action="tab" data-value="plugins" data-tab="plugins" aria-pressed="{{pressed.plugins}}">Plugins</button>
            <button type="button" data-action="tab" data-value="make" data-tab="make" aria-pressed="{{pressed.make}}">Make a plugin</button>
            <button type="button" data-action="tab" data-value="layout" data-tab="layout" aria-pressed="{{pressed.layout}}">Layout</button>
          </div>
          <template if="message">
            <div class="status">
              <p role="status">{{message}}</p>
              <template if="follow"><div class="buttons"><button type="button" data-action="{{follow.action}}" data-value="{{follow.value}}" data-follow>{{follow.label}}</button></div></template>
            </div>
          </template>
        </div>

        <!-- Plugins: what's here, then what can be added. -->
        <template if="tabs.plugins">
          <div class="search">
            <input type="search" data-action="search" value="{{query}}" placeholder="Search plugins and services" aria-label="Search plugins and services">
          </div>

          <section class="section">
            <div class="section-head">
              <h3>On this page</h3>
              <template if="space"><p class="muted">Yours are on this device until you share one. The space's reach every member turned off, and each person turns them on for themselves.</p></template>
              <template if="account">
                <div class="account" data-part="account">
                  <p class="muted">Signed in as {{account.name}}. The plugins and agents you add, which are on, where you move them and the model you pick follow you to every device you sign in on. {{account.keys}}</p>
                  <button type="button" data-action="sync-now">Sync now</button>
                </div>
                <template if="account.keysLocked"><p class="hint" data-part="keys-locked"><a href="/account/">Unlock your keys on your account page</a>, once, and they are on this device from then on.</p></template>
                <template if="account.error"><p class="error">{{account.error}}</p></template>
                <template if="account.skipped"><p class="hint">{{account.skipped}}</p></template>
              </template>
            </div>
            <template if="none"><p class="muted">Nothing here matches. Clear the search to see everything.</p></template>
            <template if="empty"><p class="muted">No plugins on this page yet. Add one below, or make your own.</p></template>
            <div class="entries" role="list">
              <template for="p of here">
                <div role="listitem" key="{{p.id}}" data-plugin-id="{{p.id}}" class="entry {{p.offClass}}">
                  <div class="entry-main">
                    <div class="head">
                      <strong>{{p.name}}</strong>
                      <span class="pill">{{p.who}}</span>
                      <template if="p.fromAccount"><span class="pill" data-from-account="{{p.id}}">From your account</span></template>
                      <template if="p.on"><span class="pill on">On</span></template>
                      <template if="p.off"><span class="pill off">Off</span></template>
                    </div>
                    <template if="p.description"><p class="muted">{{p.description}}</p></template>
                    <template if="p.error"><p class="error">{{p.error}}</p></template>
                    <template if="p.offHint"><p class="hint">{{p.offHint}}</p></template>
                    <template if="p.places.length">
                      <div class="places">
                        <template for="pl of p.places">
                          <div class="place" key="{{pl.key}}" data-place="{{pl.key}}" data-state="{{pl.state}}">
                            <span>{{pl.where}}</span>
                            <template if="pl.ok"><span class="ok">· {{pl.label}}</span></template>
                            <template if="!pl.ok"><span class="muted">· {{pl.label}}</span></template>
                            <template if="pl.moved"><span class="pill">Moved by you</span></template>
                            <template if="pl.movable"><button type="button" data-action="move" data-value="{{pl.key}}" data-move="{{pl.key}}" data-close>Move</button></template>
                            <template if="pl.moved"><button type="button" class="secondary" data-action="unmove" data-value="{{pl.key}}" data-unmove="{{pl.key}}">Put back</button></template>
                            <template if="pl.locked"><button type="button" data-action="unlock" data-value="{{pl.key}}" data-unlock="{{pl.key}}">Unlock for this plugin</button></template>
                            <template if="pl.unlocked"><button type="button" data-action="lock" data-value="{{pl.key}}">Lock again</button></template>
                          </div>
                          <template if="pl.fragile"><p class="note">This spot leans on how the page is laid out, so an update to the app may move or break it.</p></template>
                        </template>
                      </div>
                    </template>
                  </div>
                  <div class="entry-actions">
                    <template if="p.on"><button type="button" data-action="turn" data-value="{{p.id}}" data-toggle="{{p.id}}">Turn off</button></template>
                    <template if="p.off"><button type="button" class="primary" data-action="turn" data-value="{{p.id}}" data-toggle="{{p.id}}">Turn on</button></template>
                    <template if="p.reach"><button type="button" data-action="reach" data-value="{{p.id}}" data-reach="{{p.id}}" title="{{p.reachTitle}}">{{p.reach}}</button></template>
                    <template if="p.share"><button type="button" data-action="share" data-value="{{p.id}}" data-share="{{p.id}}">{{p.share}}</button></template>
                    <template if="p.user"><button type="button" class="secondary" data-action="remove" data-value="{{p.id}}" data-remove="{{p.id}}">Remove</button></template>
                  </div>
                </div>
              </template>
            </div>
          </section>

          <template if="registry">
            <section class="section">
              <div class="section-head">
                <h3>Add to this page</h3>
                <p class="muted">From this site's <a href="/packages/" target="_blank">plugin registry</a>. You see each one's code first, and once you accept it, it's added and turned on.</p>
              </div>
              <template for="g of groups">
                <div class="kind" key="{{g.kind}}" data-kind="{{g.kind}}">
                  <div class="section-head">
                    <h4>{{g.title}}</h4>
                    <p class="muted">{{g.about}}</p>
                  </div>
                  <div class="entries" role="list">
                    <template for="p of g.packages">
                      <div role="listitem" key="{{p.id}}" class="entry package">
                        <div class="entry-main">
                          <div class="head"><strong>{{p.name}}</strong><template if="p.state"><span class="pill {{p.stateClass}}">{{p.state}}</span></template></div>
                          <p class="muted">{{p.description}}</p>
                          <template if="p.can.length">
                            <details class="can">
                              <summary>What it can do once it's on</summary>
                              <div class="asks"><template for="c of p.can"><span>{{c}}</span></template></div>
                            </details>
                          </template>
                          <template if="p.asksNothing"><p class="muted">It asks for nothing: it can't draw, read or change anything.</p></template>
                          <template if="p.also"><p class="muted">{{p.also}}</p></template>
                        </div>
                        <div class="entry-actions">
                          <template if="p.add"><button type="button" data-action="package" data-value="{{p.id}}" data-package="{{p.id}}" disabled="{{p.disabled}}">Add</button></template>
                          <template if="p.turnOn"><button type="button" class="primary" data-action="turn" data-value="{{p.id}}" data-toggle="{{p.id}}">Turn on</button></template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </section>
          </template>
          <template if="nothingFound"><p class="muted">No plugin or service matches “{{query}}”. Try Make a plugin to write your own.</p></template>

          <template if="samples.length">
            <section class="section">
              <div class="section-head">
                <h3>Samples for this app</h3>
                <p class="muted">Plugins the app's author wrote to try with it.</p>
              </div>
              <div class="entries" role="list">
                <template for="s of samples">
                  <div role="listitem" key="{{s.href}}" class="entry sample">
                    <div class="entry-main">
                      <div class="head"><strong>{{s.title}}</strong><template if="s.state"><span class="pill {{s.stateClass}}">{{s.state}}</span></template></div>
                      <template if="s.description"><p class="muted">{{s.description}}</p></template>
                      <template if="s.where"><p class="muted">{{s.where}}.</p></template>
                      <template if="s.can.length">
                        <details class="can">
                          <summary>What it can do once it's on</summary>
                          <div class="asks"><template for="c of s.can"><span>{{c}}</span></template></div>
                        </details>
                      </template>
                      <template if="s.asksNothing"><p class="muted">It asks for nothing: it can't draw, read or change anything.</p></template>
                    </div>
                    <div class="entry-actions">
                      <template if="s.add"><button type="button" data-action="sample" data-value="{{s.href}}" data-sample="{{s.href}}" disabled="{{s.disabled}}">Add</button></template>
                      <template if="s.turnOn"><button type="button" class="primary" data-action="turn" data-value="{{s.id}}" data-toggle="{{s.id}}">Turn on</button></template>
                    </div>
                  </div>
                </template>
              </div>
            </section>
          </template>

          <details>
            <summary>Add a plugin or an agent from files, code or an address</summary>
            <div class="row"><button type="button" data-action="pick" data-pick>Pick files…</button> <span class="muted">A plugin's .js file and any files it lists, or an agent's .agent.md file.</span></div>
            <form data-action="paste" class="stack">
              <textarea name="code" rows="6" placeholder="export const manifest = { … }   or an agent file, starting ---" aria-label="Plugin code, or an agent file"></textarea>
              <div class="row"><button type="submit">Add this code</button> <span class="muted">It's turned on once you accept its review.</span></div>
            </form>
            <form data-action="url" class="row">
              <input name="url" type="text" placeholder="/demos/trip/samples/countdown.js or /std/agents/assistant.agent.md" aria-label="Address of a plugin or an agent on this site">
              <button type="submit" disabled="{{busy}}">Add from address</button>
            </form>
          </details>
        </template>
      </template>

      <!-- Make: a starter, a spot, then a name and the code. -->
      <!-- Drawn on every tab and while the panel is closed, hidden, so a draft being written isn't lost by looking at another tab or closing the panel. -->
      <div class="make" key="make" hidden="{{notMake}}">
        <p class="muted">Make a plugin of your own for this app. It's kept on this device, and you see its code before it runs.</p>
        <div class="step">
          <h3 data-step="1">Start from</h3>
          <div class="starters">
            <template for="s of make.starters">
              <button type="button" key="{{s.file}}" data-action="starter" data-value="{{s.file}}" data-starter="{{s.file}}" aria-pressed="{{s.pressed}}"><strong>{{s.title}}</strong><small>{{s.about}}</small></button>
            </template>
          </div>
        </div>
        <div class="step write">
          <h3>Or have it written for you</h3>
          <template if="!make.makerLinked">
            <p class="muted">Say what you want in your own words, and a language model writes the plugin. You see its code before it runs, and it uses your own key.</p>
            <div class="row"><button type="button" data-action="maker" data-add-maker>Write it for me</button></div>
          </template>
          <slot name="customize.make"></slot>
        </div>
        <div class="step live-mcp" data-part="live-mcp">
          <h3>Connect an external agent (MCP) to this tab</h3>
          <template if="!make.liveMcp.open">
            <p class="muted">Share a one-session MCP address with Claude Code, Cursor or another MCP client so it sees and shapes the exact page open in this tab—creating plugins and custom <code>ui-*</code> elements with your review. Closing this tab or disconnecting ends it.</p>
            <template if="make.liveMcp.error"><p class="error">{{make.liveMcp.error}}</p></template>
            <div class="row"><button type="button" data-action="live-mcp-open" data-live-mcp-open>Share MCP link for this tab</button></div>
          </template>
          <template if="make.liveMcp.open">
            <label class="field">Live MCP address for this tab <input type="text" readonly value="{{make.liveMcp.url}}" data-live-mcp-url></label>
            <p class="muted">Run <code>claude mcp add --transport http this-tab {{make.liveMcp.url}}</code>, or paste the address into your MCP client. You confirm the connection and each change on screen.</p>
            <template if="make.liveMcp.clientsText"><p class="ok">{{make.liveMcp.clientsText}}</p></template>
            <div class="row">
              <button type="button" data-action="live-mcp-rotate" data-live-mcp-rotate>New link</button>
              <button type="button" class="secondary" data-action="live-mcp-close" data-live-mcp-close>Disconnect</button>
            </div>
          </template>
        </div>
        <!-- One form, so choosing a spot sends the name and code as they are now, and they come back as typed. -->
        <form data-action="make-save">
          <div class="step">
            <h3 data-step="2">Where it shows</h3>
            <p>{{make.spotLabel}}</p>
            <template if="arrange"><div class="row"><button type="submit" data-action="spot" data-spot data-close>Choose a spot on the page</button> <span class="muted">The panel gets out of the way while you point.</span></div></template>
          </div>
          <template if="make.started">
            <div class="step">
              <h3 data-step="3">Name it, and change it if you like</h3>
              <label class="field">Name <input name="name" type="text" value="{{make.name}}" data-make-name></label>
              <ui-code name="code" label="Plugin code" rows="16" revision="{{make.rev}}">{{make.code}}</ui-code>
              <template if="make.ok">
                <div class="stack">
                  <p class="muted">Once it's on, it can:</p>
                  <div class="asks"><template for="pm of make.permissions"><span key="{{pm.name}}">{{pm.about}}</span></template></div>
                </div>
              </template>
              <template if="make.problem"><p class="error">{{make.problem}}</p></template>
              <div class="row">
                <button type="submit" class="primary" data-make-save>Save and turn on</button>
                <button type="submit" class="secondary" data-action="make-check">Check it</button>
              </div>
              <template if="make.status">
                <div class="status">
                  <p role="status">{{make.status}}</p>
                  <template if="make.saved"><div class="buttons"><button type="button" data-action="tab" data-value="plugins" data-see-plugins>See it in Plugins</button></div></template>
                </div>
              </template>
            </div>
          </template>
        </form>
        <template if="!make.editorLinked">
          <div class="tip">
            <p class="muted">Want more room, a copy of one of this page's plugins to change, or its log as it runs?</p>
            <button type="button" data-action="editor" data-add-editor>Add the plugin editor</button>
          </div>
        </template>
      </div>

      <!-- Layout: where plugins can go, and the elements views can use. -->
      <template if="open">
        <template if="tabs.layout">
          <div class="layout">
            <section class="section">
              <div class="section-head">
                <h3>Move things around</h3>
                <p class="muted">Any plugin's view that sits in a spot of its own can be moved: above or below any part of the page, or inside it. Your moves are kept for you, on this device.</p>
              </div>
              <div class="row">
                <template if="arrange"><button type="button" class="primary" data-action="arrange" data-arrange-start data-close>Arrange the page</button></template>
                <template if="inspect"><button type="button" data-action="inspect" data-close data-inspect-start>Inspect the page</button></template>
              </div>
              <template if="inspect"><p class="muted">Inspect: point at any part to see which plugin drew it, then hide it or add a note beside it.</p></template>
            </section>
            <section class="section">
              <div class="section-head">
                <h3>Slots the app offers</h3>
                <p class="muted">Spots the app's author left for plugins. A plugin draws in one by naming it.</p>
              </div>
              <template if="layout.noSlots"><p class="muted">This app has no slots: plugins draw beside the parts below instead.</p></template>
              <dl>
                <template for="s of layout.slots"><dt key="{{s.name}}"><code>{{s.name}}</code></dt><dd>{{s.plugins.length}} drawing here <template for="id of s.plugins"><span class="pill">{{id}}</span> </template></dd></template>
              </dl>
            </section>
            <section class="section">
              <div class="section-head">
                <h3>Parts of the page</h3>
                <p class="muted">What a plugin can be put above, below or inside. Open parts take anything; for review, you're asked first; locked, the author asked that nothing changes there (you can still unlock one plugin in Plugins).</p>
              </div>
              <template if="layout.noParts"><p class="muted">This page names no parts.</p></template>
              <dl>
                <template for="p of layout.parts"><dt key="{{p.selector}}"><code>{{p.selector}}</code></dt><dd>{{p.name}} · <span class="mark-{{p.mark}}">{{p.mark}}</span></dd></template>
              </dl>
            </section>
            <section class="section">
              <div class="section-head">
                <h3>UI elements a plugin can use</h3>
                <p class="muted">Every view can use these ui-* elements as well as plain HTML. The <a href="/docs/" target="_blank">guide</a> shows them at work.</p>
              </div>
              <div class="elements">
                <template for="e of layout.elements">
                  <details key="{{e.tag}}">
                    <summary><code>&lt;{{e.tag}}&gt;</code> <template if="e.custom"><span class="pill">Yours</span></template></summary>
                    <p class="muted">{{e.about}}</p>
                    <template if="e.attributes"><p class="muted">Attributes: <code>{{e.attributes}}</code></p></template>
                    <template if="e.custom"><div class="row"><button type="button" class="secondary" data-action="remove-component" data-value="{{e.tag}}" data-remove-component="{{e.tag}}">Remove</button></div></template>
                  </details>
                </template>
              </div>
            </section>
          </div>
        </template>
      </template>
    </div>
  </ui-panel>
</template>
