<!--
  Ask the page. ask-the-page.js sends { providers, none, question, answer,
  error, asking, suggested }: providers is [{ id, label, picked }], the
  language models the app links; none is true when it links none; answer is
  null or { text, by, tokens, sent, named }; suggested is [{ n, text }].
  The model picker sends "provider" with an id ("" for the first with a key),
  the form sends "ask" with { question }, and each suggestion "suggest:<n>".
-->
<style>
  .ask-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2); align-items: baseline; }
  .ask form { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: var(--space-1); margin: 0 0 var(--space-2); }
  .ask input[name="question"] { flex: 1 1 12em; width: auto; min-width: 0; font: inherit; height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--fg); }
  .ask form button { height: 32px; flex: 0 0 auto; width: auto; }
  .suggested { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: 0 0 var(--space-3); padding: 0; list-style: none; }
  .suggested button { height: auto; min-height: 28px; padding: 4px 10px; text-align: left; }
  .answer { white-space: pre-wrap; margin: 0 0 var(--space-1); }
  .about-answer { color: var(--fg-2); font-size: var(--text-sm); margin: 0 0 var(--space-2); }
  .sent pre { white-space: pre-wrap; max-height: 320px; overflow: auto; font-size: var(--text-sm); background: var(--bg-2); padding: 8px; border-radius: var(--radius); }
</style>
<template id="ask">
  <ui-card class="ask">
    <div class="ask-head">
      <h2>Ask the page</h2>
      <template if="!none">
        <label>Model
          <select data-action="provider" aria-label="Which model answers" disabled="{{asking}}">
            <option value="">The first with a key</option>
            <template for="p of providers"><option key="{{p.id}}" value="{{p.id}}" selected="{{p.picked}}">{{p.label}}</option></template>
          </select>
        </label>
      </template>
    </div>
    <template if="none"><p>This page links no language model. Add one from <code>/std/llm/</code>, such as <code>&lt;link rel="plugin" href="/std/llm/anthropic.js"&gt;</code>.</p></template>
    <template if="!none">
      <form data-action="ask">
        <input name="question" type="text" value="{{question}}" placeholder="Ask about any plugin on this page" aria-label="Your question" autocomplete="off" maxlength="2000">
        <button type="submit" class="primary" disabled="{{asking}}">Ask</button>
      </form>
      <ul class="suggested" aria-label="Questions to try">
        <template for="s of suggested"><li key="{{s.n}}"><button type="button" data-action="suggest:{{s.n}}" disabled="{{asking}}">{{s.text}}</button></li></template>
      </ul>
      <template if="asking"><p role="status">Asking… If this is the model's first question, it asks you for a key at the bottom of the screen.</p></template>
      <template if="error"><p class="error" role="alert">{{error}}</p></template>
      <template if="answer">
        <div class="answered" aria-live="polite">
          <p class="answer">{{answer.text}}</p>
          <p class="about-answer">Answered by {{answer.by}} · {{answer.tokens}} tokens. {{answer.named}}</p>
          <details class="sent">
            <summary>What it sent the model</summary>
            <pre>{{answer.sent}}</pre>
          </details>
        </div>
      </template>
    </template>
  </ui-card>
</template>
