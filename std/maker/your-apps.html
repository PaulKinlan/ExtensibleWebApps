<!--
  Your apps. your-apps.js sends two views:
  make: { working, request, steps: [{ n, text, ok }], answer: { text, tone }, targets: [{ name, title, picked }] }
  apps: { none, apps: [{ name, title, url, picked }], app: { name, title, url, revision }, files: [{ name, count, open, versions: [{ version, when, by, note, current, removed }] }], folder: { text, tone },
          space: { name, offline, sharedHere, waiting: [{ name, title, by, when, changed, label }], own: [{ name, title }] } (in a space only), sharing: { text, tone } }
  "folder" saves the picked app's files to a folder on the person's disk; "open-folder" makes an app from one.
  In a space, "share" and "unshare" share the picked app with its members or stop; "accept" takes one a member shared, after a review; "copy-in" copies in one the person made outside the space.
-->
<style>
  .make form { display: grid; gap: var(--space-2); margin: 0; }
  .make textarea { font: inherit; min-height: 5rem; padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--fg); }
  .make .row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .make ol { margin: 0; padding-left: var(--space-5); color: var(--fg-2); font-size: var(--text-sm); }
  .make .answer { white-space: pre-wrap; margin: 0; }
  .yours .list { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .yours .list button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .yours .files { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); }
  .yours .files li > div { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .yours .versions { margin: var(--space-1) 0 0; padding-left: var(--space-5); font-size: var(--text-sm); color: var(--fg-2); }
  .yours code { font: var(--text-sm)/1.4 var(--mono); }
  .yours :is(.shared, .own-apps) ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); }
  .yours :is(.shared, .own-apps) li { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .yours .shared-note { color: var(--fg-2); font-size: var(--text-sm); }
</style>
<template id="make">
  <ui-card class="make">
    <h2>Make an app</h2>
    <form data-action="make">
      <label class="row">For
        <select name="app" aria-label="Make a new app, or change one you made" disabled="{{working}}">
          <template for="t of targets"><option key="{{t.name}}" value="{{t.name}}" selected="{{t.picked}}">{{t.title}}</option></template>
        </select>
      </label>
      <textarea name="text" aria-label="Describe the app" placeholder="A reading list with a Sunday reminder" maxlength="4000" required disabled="{{working}}"></textarea>
      <div class="row">
        <button type="submit" class="primary" disabled="{{working}}">Make it</button>
        <template if="working"><span role="status">The app maker is working on “{{request}}”. You'll see each file before it is saved.</span></template>
      </div>
    </form>
    <template if="steps.length">
      <ol aria-label="What the app maker did">
        <template for="s of steps"><li key="{{s.n}}">{{s.text}}<template if="!s.ok"> (it failed)</template></li></template>
      </ol>
    </template>
    <template if="answer"><ui-card tone="{{answer.tone}}"><p class="answer">{{answer.text}}</p></ui-card></template>
  </ui-card>
</template>
<template id="apps">
  <ui-card class="yours">
    <ui-toolbar>
      <h2>Your apps</h2>
      <ui-spacer></ui-spacer>
      <button data-action="open-folder" title="Pick a folder with an app.html in it">Open from a folder</button>
    </ui-toolbar>
    <template if="folder"><ui-card tone="{{folder.tone}}"><p role="status">{{folder.text}}</p></ui-card></template>
    <template if="sharing"><ui-card tone="{{sharing.tone}}"><p role="status">{{sharing.text}}</p></ui-card></template>
    <template if="space">
      <template if="space.offline"><p class="shared-note">The space can't be reached just now, so the apps its members shared aren't shown.</p></template>
      <template if="space.waiting.length">
        <section class="shared" aria-label="Shared in this space">
          <h3>Shared in this space</h3>
          <ul>
            <template for="s of space.waiting">
              <li key="{{s.name}}"><strong>{{s.title}}</strong> <span class="shared-note">from the space<template if="s.by">, shared by {{s.by}}</template>, {{s.when}}</span>
                <template if="s.changed"> <ui-badge tone="warn">new version</ui-badge></template>
                <button data-action="accept" data-value="{{s.name}}">{{s.label}}</button>
              </li>
            </template>
          </ul>
          <p class="shared-note">An app from the space runs here only once you accept its files.</p>
        </section>
      </template>
      <template if="space.own.length">
        <section class="own-apps" aria-label="Your apps outside this space">
          <h3>Your apps outside this space</h3>
          <ul>
            <template for="o of space.own">
              <li key="{{o.name}}"><strong>{{o.title}}</strong> <button data-action="copy-in" data-value="{{o.name}}">Copy into this space</button></li>
            </template>
          </ul>
        </section>
      </template>
    </template>
    <template if="none"><p>None yet. Describe one above, and it appears here, working, with every version of its files.</p></template>
    <template if="!none">
      <div class="list">
        <template for="a of apps"><button key="{{a.name}}" data-action="pick" data-value="{{a.name}}" aria-pressed="{{a.picked}}">{{a.title}}</button></template>
      </div>
      <template if="app">
        <ui-toolbar>
          <h3>{{app.title}}</h3>
          <ui-spacer></ui-spacer>
          <button data-action="reload">Reload</button>
          <button data-action="folder" title="Keep a copy of its files on your disk, or take it to another device">Save to a folder</button>
          <template if="space"><template if="!space.sharedHere"><button data-action="share" title="Each member sees it in their apps, and runs it once they accept its files">Share with the space</button></template><template if="space.sharedHere"><button data-action="share" title="Send the space this version: members accept it first">Share this version</button> <button data-action="unshare">Stop sharing</button></template></template>
          <a href="{{app.url}}">Open {{app.url}}</a>
        </ui-toolbar>
        <ui-preview app="{{app.name}}" revision="{{app.revision}}" label="{{app.title}}"></ui-preview>
        <h3>Files</h3>
        <ul class="files">
          <template for="f of files">
            <li key="{{f.name}}">
              <div><code>{{f.name}}</code> <ui-badge>{{f.label}}</ui-badge> <button data-action="history" data-value="{{f.name}}" aria-expanded="{{f.open}}">History</button></div>
              <template if="f.open">
                <ol class="versions">
                  <template for="v of f.versions">
                    <li key="{{v.version}}">Version {{v.version}}, {{v.when}}, by {{v.by}}: {{v.note}}
                      <template if="v.current"> <ui-badge tone="ok">now</ui-badge></template>
                      <template if="!v.current"> <button data-action="restore:{{f.name}}:{{v.version}}">Put this back</button></template>
                    </li>
                  </template>
                </ol>
              </template>
            </li>
          </template>
        </ul>
      </template>
    </template>
  </ui-card>
</template>
