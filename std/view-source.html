<!--
  View source. view-source.js sends { plugins, shown }: plugins is every
  plugin the app links, each { id, name, description, enabled, picked };
  shown is null or the picked plugin's { id, name, description, enabled,
  code, rev, permissions: [{ name, about }] }; rev changes each time it is
  read, so the code shown is always the latest. The picker sends "show" with
  the plugin's id (an app can link dozens of plugins: a picker stays one row,
  where a button each filled a phone's screen twice over); Close sends "hide".
-->
<style>
  .sources { display: grid; gap: 2px; max-width: 28rem; margin: 0 0 var(--space-3); font-size: var(--text-sm); color: var(--fg-2); }
  .shown h3 { margin: 0 0 var(--space-1); }
  .shown .about { margin: 0 0 var(--space-2); color: var(--fg-2); }
  .may { list-style: none; margin: 0 0 var(--space-3); padding: 0; display: grid; gap: 2px; }
  .may code { font-size: var(--text-sm); color: var(--fg-2); }
  .shown-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2); align-items: baseline; }
</style>
<template id="source">
  <ui-card>
    <h2>View source</h2>
    <p>Every part of this page is a plugin: one file you can read. Pick one to see what it may do and its code.</p>
    <label class="sources">Plugin
      <select data-action="show" aria-label="Plugin to read">
        <option value="">Pick a plugin</option>
        <template for="p of plugins"><option key="{{p.id}}" value="{{p.id}}" selected="{{p.picked}}">{{p.name}}</option></template>
      </select>
    </label>
    <template if="shown">
      <div class="shown">
        <div class="shown-head">
          <h3>{{shown.name}} <template if="!shown.enabled"><ui-badge tone="warn">off</ui-badge></template></h3>
          <button type="button" data-action="hide">Close</button>
        </div>
        <p class="about">{{shown.description}}</p>
        <p><strong>It may:</strong></p>
        <ul class="may">
          <template for="p of shown.permissions"><li key="{{p.name}}">{{p.about}} <code>{{p.name}}</code></li></template>
        </ul>
        <template if="!shown.permissions.length"><p>Nothing beyond running: it can't draw, read or change anything.</p></template>
        <ui-code readonly label="Code of {{shown.name}}" rows="18" revision="{{shown.rev}}">{{shown.code}}</ui-code>
      </div>
    </template>
  </ui-card>
</template>
