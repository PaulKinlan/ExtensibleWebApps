<!--
  ui-debug: a bug button that stays on screen and opens a panel. What the
  view puts inside the element is the panel's content.
  Attributes: corner="bottom-left|bottom-right|top-left|top-right|inline"
  (where the bug floats when drawn in a slot the app marks float, such as
  <slot name="debug" float>, which the platform pins to that corner; inline
  leaves it in the page's flow), problems (a count
  shown on the bug, which turns red above 0), label (the button's name),
  toggle (an action sent with true or false when the panel opens or closes).

  Copying: a button inside with data-copy="name" copies the text of the
  element inside with data-copy-source="name", with the page's address,
  browser and time at the top, so it can be pasted into a bug report.

  The behaviour is in ui-debug.js, linked below.
-->
<template>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    /* The bug sits where its view is drawn. A slot marked float keeps it in a corner of the screen (see host.css). */
    :host { display: inline-block; }

    .bug { display: inline-flex; align-items: center; gap: var(--space-1); height: 40px; min-width: 40px; padding: 0 var(--space-2); justify-content: center; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--fg-2); box-shadow: var(--shadow-1), 0 4px 12px rgb(0 0 0 / 0.12); cursor: pointer; font: 600 var(--text-sm) var(--font); }
    :host([corner="inline"]) .bug { height: 28px; box-shadow: none; }
    .bug:hover { color: var(--fg); }
    .bug:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
    .bug svg { width: 20px; height: 20px; }
    .bug.problems { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
    .count:empty { display: none; }

    /* The panel is a popover, so it opens in the top layer, above the page and outside its view's containment. */
    #panel { position: fixed; margin: 0; inset: auto auto 64px var(--space-4); width: min(760px, calc(100vw - 2 * var(--space-4))); max-height: min(70vh, 640px); display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); color: var(--fg); box-shadow: 0 8px 32px rgb(0 0 0 / 0.2); }
    #panel:not(:popover-open) { display: none; }
    :host([corner="bottom-right"]) #panel, :host([corner="inline"]) #panel { inset: auto var(--space-4) 64px auto; }
    :host([corner="top-left"]) #panel { inset: 64px auto auto var(--space-4); }
    :host([corner="top-right"]) #panel { inset: 64px var(--space-4) auto auto; }
    header { display: flex; align-items: center; gap: var(--space-2); }
    header strong { font-size: var(--text-md); }
    #status { flex: 1; color: var(--ok); font-size: var(--text-sm); }
    .close { all: unset; cursor: pointer; width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--radius); color: var(--fg-2); font-size: 18px; }
    .close:hover { background: var(--bg-2); color: var(--fg); }
    .close:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); }
    ::slotted(pre) { margin: 0; flex: 1 1 auto; min-height: 120px; overflow: auto; padding: var(--space-2); border-radius: var(--radius); background: var(--bg-2); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
    ::slotted([hidden]) { display: none !important; }
  </style>
  <button class="bug" type="button" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 6.5a4 4 0 0 1 8 0"/><rect x="7" y="7" width="10" height="13" rx="5"/><path d="M12 11v9M3 13h4M17 13h4M4 7l3.5 2M20 7l-3.5 2M4 20l3.5-2.5M20 20l-3.5-2.5"/>
    </svg>
    <span class="count"></span>
  </button>
  <section id="panel" role="dialog" popover="manual">
    <header>
      <strong id="title"></strong>
      <span id="status" role="status"></span>
      <button class="close" type="button" aria-label="Close">×</button>
    </header>
    <slot></slot>
  </section>
</template>
<script type="module" src="ui-debug.js"></script>
