<!--
  ui-stack: lays its children out in a column, or a row, with even spacing.
  Attributes: direction="row", gap="0"…"6", align, justify, wrap.
  A template-only element: the platform defines it from this file, and the
  attributes work through :host() selectors, so it needs no JavaScript.
-->
<template>
  <style>
    :host { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
    :host([direction="row"]) { flex-direction: row; align-items: center; }
    :host([wrap]) { flex-wrap: wrap; }
    :host([gap="0"]) { gap: 0; }
    :host([gap="1"]) { gap: var(--space-1); }
    :host([gap="2"]) { gap: var(--space-2); }
    :host([gap="4"]) { gap: var(--space-4); }
    :host([gap="5"]) { gap: var(--space-5); }
    :host([gap="6"]) { gap: var(--space-6); }
    :host([align="start"]) { align-items: flex-start; }
    :host([align="center"]) { align-items: center; }
    :host([align="end"]) { align-items: flex-end; }
    :host([align="stretch"]) { align-items: stretch; }
    :host([justify="start"]) { justify-content: flex-start; }
    :host([justify="center"]) { justify-content: center; }
    :host([justify="end"]) { justify-content: flex-end; }
    :host([justify="between"]) { justify-content: space-between; }
  </style>
  <slot></slot>
</template>
