<!--
  ui-grid: as many columns as fit, each at least `min` wide.
  Attributes: min="12rem", gap="1"…"6".

  The gap works through :host() selectors, but `min` is a length the plugin
  chooses, so a few lines of JavaScript check it and pass it to the style.
  The script is inline because it is short; longer ones go in a linked file,
  as ui-table does. `this.constructor.template` is the template above.
-->
<template>
  <style>
    :host { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(min(var(--min, 12rem), 100%), 1fr)); }
    :host([gap="0"]) { gap: 0; }
    :host([gap="1"]) { gap: var(--space-1); }
    :host([gap="2"]) { gap: var(--space-2); }
    :host([gap="4"]) { gap: var(--space-4); }
    :host([gap="5"]) { gap: var(--space-5); }
    :host([gap="6"]) { gap: var(--space-6); }
  </style>
  <style id="min"></style>
  <slot></slot>
</template>
<script type="module">
  // Only a plain length such as 12rem or 240px; anything else keeps the default.
  const LENGTH = /^\d+(\.\d+)?(rem|px|em|ch|%)$/;

  export default class UiGrid extends HTMLElement {
    static observedAttributes = ["min"];

    connectedCallback() {
      if (!this.shadowRoot) this.attachShadow({ mode: "open" }).append(document.importNode(this.constructor.template.content, true));
      this.attributeChangedCallback();
    }

    attributeChangedCallback() {
      const min = this.getAttribute("min");
      const style = this.shadowRoot?.getElementById("min");
      // Always set it, so a nested grid never inherits its parent's minimum.
      if (style) style.textContent = `:host { --min: ${min && LENGTH.test(min) ? min : "12rem"} }`;
    }
  }
</script>
