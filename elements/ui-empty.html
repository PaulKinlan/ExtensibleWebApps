<!--
  ui-empty: what to show when there is nothing yet. Put a sentence and a
  button inside it. Attributes: heading.
  Template only: {{heading}} is filled from the attribute.
-->
<template>
  <style>
    :host { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); padding: var(--space-6) var(--space-5); border: 1px dashed color-mix(in srgb, var(--fg-2) 35%, var(--border)); border-radius: var(--radius-lg); background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%), color-mix(in srgb, var(--bg-2) 50%, transparent); color: var(--fg-2); text-wrap: balance; }
    h3 { margin: 0; font-size: var(--text-lg); font-weight: 650; color: var(--fg); }
    ::slotted(button), ::slotted(a.button) { margin-top: var(--space-2); }
    h3:empty { display: none; }
  </style>
  <h3>{{heading}}</h3>
  <slot></slot>
</template>
