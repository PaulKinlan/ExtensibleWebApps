<!--
  ui-commands: a command palette. A button (and a shortcut, Cmd K on a Mac,
  Ctrl K elsewhere) opens a list of commands to search and pick from, and
  each command's own keys run it from anywhere on the page.

  The commands are the element's children, one button each, which it reads
  and doesn't show:

    <button data-command="library/finish" data-keys='["Alt+D"]'
            data-group="Books" data-description="…">Mark as done</button>

  Attributes: label (the button's name, "Commands" if missing), open-keys
  (the shortcut that opens it, "Mod+K"; Mod is Cmd on a Mac and Ctrl
  elsewhere), run (the action sent with a command's name when it is picked
  or its keys are pressed), no-button (shortcuts only, no button),
  message (text announced for a few seconds whenever message-at changes).

  The behaviour is in ui-commands.js, linked below. std/commands/palette.js
  draws one.
-->
<template>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :host { display: inline-block; }
    :host([no-button]) .open { display: none; }

    .open { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--fg-2); cursor: pointer; font: 500 var(--text-sm) var(--font); }
    .open:hover { color: var(--fg); border-color: color-mix(in srgb, var(--fg-2) 40%, var(--border)); }
    .open:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
    .open svg { width: 16px; height: 16px; flex: none; }
    kbd { font: 500 12px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-2); color: var(--fg-2); white-space: nowrap; }
    .open kbd:empty { display: none; }
    /* On a phone there are no shortcuts to show, and room is short. */
    @media (pointer: coarse) { .open kbd { display: none; } }

    dialog { width: min(640px, calc(100vw - 2 * var(--space-4))); max-height: min(70vh, 560px); margin: 12vh auto auto; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); color: var(--fg); box-shadow: 0 16px 48px rgb(0 0 0 / 0.25); overflow: hidden; }
    dialog[open] { display: flex; flex-direction: column; }
    dialog::backdrop { background: rgb(0 0 0 / 0.3); }
    @media (max-width: 600px) { dialog { margin-top: var(--space-4); max-height: calc(100dvh - 2 * var(--space-4)); } }
    .search { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); }
    .search svg { width: 18px; height: 18px; color: var(--fg-2); flex: none; }
    input { flex: 1; min-width: 0; min-height: 44px; border: 0; background: transparent; color: var(--fg); font: var(--text-md) var(--font); }
    input:focus-visible { outline: none; }
    ul { list-style: none; margin: 0; padding: var(--space-1); overflow: auto; overscroll-behavior: contain; }
    .group { padding: var(--space-2) var(--space-2) var(--space-1); color: var(--fg-2); font-size: var(--text-xs, 12px); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    [role="option"] { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: var(--space-2); border-radius: var(--radius); cursor: pointer; }
    [role="option"][aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .what { flex: 1; min-width: 0; }
    .title { display: block; }
    .about { display: block; color: var(--fg-2); font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .keys { display: flex; gap: var(--space-1); flex: none; }
    @media (pointer: coarse) { .keys { display: none; } }
    .empty { margin: 0; padding: var(--space-4); color: var(--fg-2); text-align: center; }
    .empty[hidden] { display: none; }

    /* What happened to the last command, briefly, at the bottom of the screen. */
    /* A popover, so it shows in the top layer, above the page and outside its view's containment. */
    .toast { position: fixed; inset: auto 0 var(--space-4); margin: 0 auto; border: 0; width: max-content; max-width: calc(100vw - 2 * var(--space-4)); padding: var(--space-2) var(--space-3); border-radius: var(--radius); background: var(--fg); color: var(--bg); font-size: var(--text-sm); box-shadow: var(--shadow-1); }
    .toast:not(:popover-open) { display: none; }
  </style>
  <button class="open" type="button" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="label"></span>
    <kbd class="hint"></kbd>
  </button>
  <dialog>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Type a command…">
    </div>
    <ul id="list" role="listbox"></ul>
    <p class="empty" hidden>No commands match.</p>
  </dialog>
  <div class="toast" role="status" popover="manual"></div>
</template>
<script type="module" src="ui-commands.js"></script>
