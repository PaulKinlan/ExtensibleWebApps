<!--
  ui-editor: a Markdown editor, on CodeMirror 6 (vendor/codemirror/, loaded
  the first time one is drawn). Headings, emphasis, links and code are
  styled as you type, Hugo shortcodes stand out, the front matter is shown plainly, and it has undo, search
  (Mod+F) and Tab to indent.

  Attributes:
    name, label          the field's name in a form, and its accessible name
    placeholder, readonly
    revision             the text content is read again when this changes
    document             which document this is: when it changes, the text
                         content goes in with an undo history of its own
    action               sent with the whole text after a pause in typing
    selection-action     sent with { from, to, text } when the selection settles
    paste-action         a paste is sent as { from, to, text, html, files } and
    drop-action          a drop from outside as the same, instead of going in
    select="from,to"     selects that range and scrolls to it, when it changes
    annotations          JSON: [{ from, to, severity, message }] to underline,
                         severity "info", "warning" or "error"
    spellcheck="true"    the browser checks the spelling (off otherwise)
    words                JSON: ["Hugo", "WebMCP"], words the browser's spell
                         checker accepts (Chrome's custom dictionary, where
                         the browser has one)

  The text to start with is the element's text content:

    <ui-editor name="text" action="edit" revision="{{rev}}">{{text}}</ui-editor>

  As with ui-code, a redraw keeps what the person typed until `revision`
  changes. When it does, the new text goes in as an edit (only what differs
  changes), so the undo history, the selection and the scroll position are
  kept. After a paste or drop the plugin put in, the caret goes after it.

  The events are the host's editor events (src/host/editing.ts), sent through
  `ui-action`, so a plugin hears them the same way from a textarea. Offsets
  count characters in the whole text. The behaviour is in ui-editor.js.
-->
