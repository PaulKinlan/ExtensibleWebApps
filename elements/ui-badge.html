<!--
  ui-badge: a short status word.
  Attributes: tone="neutral|accent|ok|warn|danger".
  Template only: no JavaScript.
-->
<template>
  <style>
    /* One colour per tone; the fill and the hairline ring are mixed from it. */
    :host { --tone: var(--fg-2); display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: var(--text-sm); font-weight: 600; line-height: 1; letter-spacing: 0.01em; color: var(--tone); background: color-mix(in srgb, var(--tone) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone) 22%, transparent); white-space: nowrap; width: fit-content; }
    :host([tone="accent"]) { --tone: var(--accent); }
    :host([tone="ok"]) { --tone: var(--ok); }
    :host([tone="warn"]) { --tone: var(--warn); }
    :host([tone="danger"]) { --tone: var(--danger); }
    /* A toned badge leads with a dot, so the tone reads without colour alone. */
    :host([tone]:not([tone="neutral"]))::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  </style>
  <slot></slot>
</template>
