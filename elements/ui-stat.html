<!--
  ui-stat: a number with its label, and an optional change.
  Attributes: label, value, delta, tone="ok|warn|danger" (colours the delta).

  Template only. Each {{name}} is filled, as text, from the attribute of that
  name, and filled again whenever the attribute changes. A hole left empty
  leaves its element :empty, which the style uses to hide the delta.
-->
<template>
  <style>
    :host { --tone: var(--fg-2); display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); padding: var(--space-4) var(--space-5); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-1); min-width: 0; }
    .label { font-size: var(--text-sm); font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.06em; }
    .value { font-size: var(--text-2xl); font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--fg); overflow-wrap: anywhere; }
    /* The change sits in a pill, coloured by tone. */
    .delta { font-size: var(--text-sm); font-weight: 500; font-variant-numeric: tabular-nums; color: var(--tone); }
    :host([tone]) .delta { padding: 2px var(--space-2); border-radius: 999px; background: color-mix(in srgb, var(--tone) 12%, transparent); }
    :host([tone="ok"]) { --tone: var(--ok); }
    :host([tone="danger"]) { --tone: var(--danger); }
    :host([tone="warn"]) { --tone: var(--warn); }
    .delta:empty { display: none; }
  </style>
  <span class="label">{{label}}</span>
  <span class="value">{{value}}</span>
  <span class="delta">{{delta}}</span>
  <slot></slot>
</template>
