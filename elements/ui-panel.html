<!--
  ui-panel: a button that stays on screen and opens a panel above the page.
  What the view puts inside the element is the panel's content.
  Attributes: label (the button's text and the panel's title), toggle (an
  action sent with true or false when the panel opens or closes, so the
  plugin can draw what it shows only while someone is looking). A button
  inside with data-close closes the panel when clicked.

  It doesn't place itself: the slot its view is drawn in decides where it
  sits (the platform pins the "customize" slot to a corner, see styles.css).
  std/customize.js is one plugin that uses it.

  The behaviour is in ui-panel.js, linked below.
-->
<template>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :host { display: inline-block; }
    .launch { display: inline-flex; align-items: center; height: 40px; padding: 0 var(--space-3); border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); box-shadow: var(--shadow-2); cursor: pointer; font: 600 var(--text-sm) var(--font); }
    .launch:hover { background: var(--bg-2); }
    .launch:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
    /* A popover, so it opens in the top layer, above the page and outside its view's containment. Manual, so a review card above it doesn't close it (ui-panel.js closes it on Escape and a click outside). */
    #panel { position: fixed; margin: auto; inset: 0; width: min(720px, calc(100vw - 2 * var(--space-4))); max-height: min(85vh, 900px); overflow: auto; padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); color: var(--fg); box-shadow: 0 8px 32px rgb(0 0 0 / 0.2); }
    #panel:not(:popover-open) { display: none; }
    #panel::backdrop { background: rgb(0 0 0 / 0.3); }
    header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
    header h2 { flex: 1; margin: 0; font-size: var(--text-lg); }
    .close { all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--radius); color: var(--fg-2); font-size: 20px; }
    .close:hover { background: var(--bg-2); color: var(--fg); }
    .close:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); }
  </style>
  <button class="launch" type="button" aria-expanded="false" aria-controls="panel"></button>
  <section id="panel" role="dialog" aria-labelledby="title" popover="manual">
    <header>
      <h2 id="title"></h2>
      <button class="close" type="button" aria-label="Close">×</button>
    </header>
    <slot></slot>
  </section>
</template>
<script type="module" src="ui-panel.js"></script>
