<!--
  ui-form: a form built from a collection's schema, with labels, input types,
  required fields, and the errors from the kernel's checks.
  Attributes: collection, fields="title,author" (which fields, in order),
  record (edit this record; without it the form adds new ones), submit (the
  button's text), action (sent with the saved record's id).

  A list field (type: "array") gets a row per item, each with a Remove
  button, and an Add button; a group (type: "object") gets a fieldset of its
  own fields. Lists of groups work too, two levels deep: a recipe's
  ingredients, each with an amount, a unit and an item.

  The behaviour is in ui-form.js, linked below.
-->
<template>
  <style>
    :host { display: block; min-width: 0; }
    /* Unseen until the view's other bound elements have drawn too (bound-element.js), so none jumps as another fills in. */
    :host(:state(waiting)) { visibility: hidden; }
    form { display: flex; flex-direction: column; gap: var(--space-3); }
    .fields { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(min(14rem, 100%), 1fr)); }
    label { display: flex; flex-direction: column; gap: 6px; font-size: var(--text-sm); font-weight: 500; color: var(--fg-2); }
    label.check { flex-direction: row; align-items: center; gap: var(--space-2); color: var(--fg); font-size: var(--text-md); }
    label.wide { grid-column: 1 / -1; }
    /* Fields: a little taller than the page's, sunk slightly into the surface, and lit by the accent when in use. */
    input:not([type=checkbox]), select, textarea { font: inherit; font-size: var(--text-md); font-weight: 400; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-height: 36px; padding: 0 10px; box-shadow: inset 0 1px 2px light-dark(rgb(16 16 32 / 0.04), rgb(0 0 0 / 0.25)); transition: border-color var(--duration, 140ms) var(--ease, ease), box-shadow var(--duration, 140ms) var(--ease, ease); }
    input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--fg-2) 75%, transparent); }
    /* Not while focused or invalid, so those borders stay as they are. */
    :is(input:not([type=checkbox]), select, textarea):not(:focus, [aria-invalid=true]):hover { border-color: color-mix(in srgb, var(--fg) 28%, var(--border)); }
    input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    textarea { padding: var(--space-2) 10px; min-height: 88px; resize: vertical; line-height: 1.5; }
    input:focus-visible, select:focus-visible, textarea:focus-visible { /* Transparent, but forced-colors mode draws it, where shadows vanish. */ outline: 2px solid transparent; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    button:focus-visible, input[type=checkbox]:focus-visible { outline: 3px solid var(--ring, color-mix(in srgb, var(--accent) 70%, transparent)); outline-offset: 1px; }
    [aria-invalid=true] { border-color: var(--danger); }
    [aria-invalid=true]:focus-visible { border-color: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 22%, transparent); }
    .actions { display: flex; gap: var(--space-2); align-items: center; justify-content: flex-end; }
    .status { color: var(--fg-2); font-size: var(--text-sm); }
    .error { color: var(--danger); font-size: var(--text-sm); }
    fieldset { grid-column: 1 / -1; margin: 0; padding: var(--space-2) var(--space-3) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
    legend { font-size: var(--text-sm); color: var(--fg-2); padding: 0 var(--space-1); }
    fieldset > small { color: var(--fg-2); font-size: var(--text-sm); }
    ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
    li { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: end; }
    li + li { border-top: 1px solid var(--border); padding-top: var(--space-2); }
    li > :first-child { flex: 1 1 16rem; min-width: 0; }
    .group { display: grid; gap: var(--space-2); grid-template-columns: repeat(auto-fit, minmax(min(5rem, 100%), 1fr)); }
    /* The same buttons as the page's (src/host/styles.css), which can't reach into a shadow root. */
    button { font: inherit; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 36px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--fg); box-shadow: var(--shadow-1); cursor: pointer; white-space: nowrap; transition: background var(--duration, 140ms) var(--ease, ease), border-color var(--duration, 140ms) var(--ease, ease); }
    button:hover { background: var(--bg-2); border-color: color-mix(in srgb, var(--fg) 22%, var(--border)); }
    button:active { box-shadow: none; transform: translateY(0.5px); }
    button[type=button] { font-size: var(--text-sm); height: 32px; padding: 0 var(--space-3); }
    button[type=submit] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
    button[type=submit]:hover { background: color-mix(in srgb, var(--accent) 88%, black); border-color: color-mix(in srgb, var(--accent) 88%, black); }
    button[type=submit]:disabled { opacity: .6; cursor: progress; }
  </style>
</template>
<script type="module" src="ui-form.js"></script>
