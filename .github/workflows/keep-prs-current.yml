# Keeps every open pull request merged with main, so no one finds out at merge
# time that their branch fell behind.
#
# Each time main changes, for every open PR whose branch is in this repo:
#   - main merges cleanly: push the merge commit, and start the checks on it
#     (a push by this workflow starts none by itself).
#   - the only conflicts are generated files: take main's docs/api.md (only
#     main writes it) and drop the registry files (the build makes them, and
#     they aren't committed), then push. Branches from before they stopped
#     being committed are tidied this way.
#   - anything else conflicts: leave the branch alone and keep one comment on
#     the PR up to date with the files that need a person.
#
# It only ever adds merge commits (never rebases or force-pushes), so anyone
# working on the branch can just pull.

name: Keep PRs current

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # to start the checks on a merge it pushed (see push below)
  contents: write
  pull-requests: write

concurrency:
  group: keep-prs-current
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge main into each open PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated files no pull request should carry (regenerate-reference.yml, scripts/generated.mjs).
          GENERATED="docs/api.md packages/catalog.json packages/index.html packages/index.json"
          MARKER="<!-- keep-prs-current -->"

          # The comment this workflow keeps on a PR: written, replaced, or removed.
          note() {
            pr="$1"; body="$2"
            id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
            if [ -n "$body" ]; then
              if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$MARKER
          $body" >/dev/null
              else gh api "repos/$REPO/issues/$pr/comments" -f body="$MARKER
          $body" >/dev/null; fi
            elif [ -n "$id" ]; then gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null; fi
          }

          # GitHub won't let this workflow's token push a change to .github/workflows,
          # so a merge that brings one in is left for a person.
          push() {
            if git push -q origin "$branch"; then
              note "$pr" ""
              # A push made with this workflow's token starts no other workflow, so the merge commit, now the
              # pull request's head, would have no checks at all and could be merged untested. Start them here.
              for checks in platform-checks.yml server-checks.yml; do
                gh workflow run "$checks" --repo "$REPO" --ref "$branch" || echo "::warning::Couldn't start $checks on $branch"
              done
            else
              git reset -q --hard "origin/$branch"
              note "$pr" "Main has moved on and merges cleanly into this branch, but this bot couldn't push the merge (main changed \`.github/workflows\`, which its token can't do). Merge main into this branch once by hand."
            fi
          }

          # After a merge: the branch's generated files go back to main's (docs/api.md) or out of the repo
          # (the rest), folded into the merge commit, so the branch carries none of them.
          tidy() {
            git checkout -q origin/main -- docs/api.md
            for f in $GENERATED; do [ "$f" = "docs/api.md" ] || git rm -q --cached --ignore-unmatch -- "$f"; done
            git diff --cached --quiet || git commit -q --amend --no-edit
          }

          gh pr list --repo "$REPO" --state open --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"' |
          while read -r pr branch; do
            echo "::group::#$pr ($branch)"
            git fetch -q origin "$branch" main
            git checkout -q -B "$branch" "origin/$branch"
            if git merge-base --is-ancestor origin/main HEAD; then echo "already current"; note "$pr" ""; echo "::endgroup::"; continue; fi

            if git merge -q --no-edit origin/main; then
              tidy && push
            else
              conflicts=$(git diff --name-only --diff-filter=U)
              others=$(for f in $conflicts; do case " $GENERATED " in *" $f "*) ;; *) echo "$f";; esac; done)
              if [ -z "$others" ]; then
                for f in $conflicts; do
                  if [ "$f" = "docs/api.md" ]; then git checkout -q origin/main -- "$f"; else git rm -q --cached --ignore-unmatch -- "$f"; rm -f -- "$f"; fi
                done
                git commit -q --no-edit && tidy && push
              else
                git merge --abort
                list=$(echo "$others" | sed 's/^/- `/; s/$/`/')
                note "$pr" "Main has moved on and these files conflict with this branch, so they need a person to merge:

          $list

          Generated files (\`docs/api.md\`, \`packages/index.*\`, \`packages/catalog.json\`) never need a person: take main's \`docs/api.md\` and \`git rm\` the others."
              fi
            fi
            echo "::endgroup::"
          done
