# Keeps docs/api.md matching the code, without it ever being part of a pull
# request, so pull requests can't conflict over it.
#
# docs/api.md is generated: the kernel prints its own reference. It is kept in
# the repo so it reads on GitHub, but only main writes it: each time main
# changes, this runs `npm run reference` and commits the file if it came out
# different. A pull request that changes the kernel's API leaves the file alone;
# it is rewritten a few minutes after the merge.
#
# On a pull request, the `untouched` job fails if the branch changes any
# generated file (docs/api.md, or the registry and gallery files the build
# makes: scripts/generated.mjs), and says how to put it back.
#
# Commits made with this workflow's token don't start other workflows, so it
# can't loop. Cloudflare's Git integration still deploys the commit.

name: Regenerate API reference

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-reference-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  untouched:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generated files are left to main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$BASE" HEAD)
          changed=$(git diff --name-only "$base" HEAD -- docs/api.md packages/index.html packages/index.json packages/catalog.json)
          if [ -z "$changed" ]; then echo "No generated file changed."; exit 0; fi
          echo "::error::This branch changes generated files: $(echo $changed). They are made on main (docs/api.md) or by the build (the rest), never in a pull request, so pull requests can't conflict over them."
          echo "Put them back with:"
          echo "  git fetch origin main && git merge origin/main"
          echo "  git checkout origin/main -- docs/api.md"
          echo "  git rm -q --cached --ignore-unmatch packages/index.html packages/index.json packages/catalog.json"
          echo "  git commit -m 'Leave generated files to main and the build'"
          exit 1

  reference:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci && npm i --no-save playwright@1.65.0 && npx playwright install --with-deps chromium

      - name: Run npm run reference
        run: npm run reference

      - name: Commit docs/api.md if it changed
        run: |
          if git diff --quiet -- docs/api.md; then echo "docs/api.md is current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api.md
          git commit -q -m "Regenerate docs/api.md"
          # If main moved on while this ran, the run for the newer commit does the work (it cancels this one).
          # Any other refusal (main protected against this token, say) fails the run, so it is seen.
          if git push -q origin HEAD:main; then exit 0; fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD~1)" ]; then echo "::notice::Main moved on; the next run regenerates it."; exit 0; fi
          echo "::error::Couldn't push docs/api.md to main. Let github-actions[bot] push to main, or run npm run reference and commit it there."
          exit 1
