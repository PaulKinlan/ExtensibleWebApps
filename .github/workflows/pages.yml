# Builds the app and publishes it to GitHub Pages on every push to main, so
# the demos can be tried at https://paulkinlan.github.io/ExtensibleWebApps/.
#
# GitHub Pages can't set response headers, so the workers' content security
# policy (vite.config.ts, public/_headers) isn't applied there: plugins on the
# Pages site are not blocked from the network. Hosts that honour _headers,
# such as Cloudflare Pages, apply it.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
