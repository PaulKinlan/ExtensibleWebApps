# Runs the hosts' checks (tests/server/run.mjs) on every pull request and on
# main: the same space, sign-in, sync, server-plugin, feed-reader and
# move-a-space checks against the Node host and against the Cloudflare host
# under `wrangler dev` (workerd, with Durable Objects and Dynamic Workers for
# server plugins), so a change that breaks one host shows before it merges.
#
# No secrets: wrangler dev runs everything on the runner.

name: Server checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the site, the Cloudflare kernel and the Node kernel, then runs both hosts and the move between them.
      - name: Node and Cloudflare hosts
        run: npm run test:server
        env:
          # wrangler dev without prompts or telemetry.
          CI: "1"
          WRANGLER_SEND_METRICS: "false"
