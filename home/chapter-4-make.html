  <ui-card class="chapter">
    <h2><ui-badge tone="accent">4</ui-badge> Make your own</h2>
    <p>Everything on this page is a plugin, and you can write one too. The editor below starts you from a template or from a copy of any plugin on the page.</p>
    <ol>
      <li>Pick a starting point. <strong>Show a card on the page</strong> is the smallest.</li>
      <li>Change it. The manifest at the top says what it asks for; Check tells you, in plain words, what that would let it do.</li>
      <li>Save and run. You see its code and its permissions on a review card first, and nothing runs until you accept.</li>
    </ol>
    <p>Your plugins are kept in this browser, beside the page's own, and the switchboard lists them with the rest. A copy runs beside its original: switch the original off to try yours instead. If something goes wrong, <a href="?reset">?reset</a> turns the page's own plugins back on.</p>
  </ui-card>
</template>
