<!doctype html>
<!--
  Calendar: an app made of three plugins, each its own file.

  events.js  owns the `events` collection, and draws the form and table
  month.js   reads the events and draws a month as a grid
  agenda.js  the next two weeks: events, plus birthdays read from the
             contacts app's collection, which this app doesn't own

  The month grid brings its own styles, in month.html: they reach only that
  plugin's views. A <style> here would still win over them, so the page
  always has the last word on how its plugins look.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar</title>
  <meta name="description" content="A month of events, and the two weeks ahead.">
  <meta name="gallery" content="slots">
  <meta name="gallery-about" content="A month grid, and an agenda that includes birthdays from the contacts app.">
  <meta name="gallery-shows" content="nested templates, reading another app's data.">
  <link rel="stylesheet" href="/platform/host.css">
  <script type="module" src="/platform/host.js"></script>
  <link rel="plugin" href="month.js">
  <link rel="plugin" href="events.js">
  <link rel="plugin" href="agenda.js">
  <!-- A standard plugin: a bug button that shows errors and the trace, to copy into a bug report. -->
  <link rel="plugin" href="/std/debug-console.js">
</head>
<body>
  <header>
    <h1>Calendar</h1>
    <nav class="site" aria-label="This site">
      <a href="/">Home</a>
      <a href="/demos/">All demos</a>
      <a href="/docs/">Docs</a>
      <a href="/workbench/">Workbench</a>
    </nav>
  </header>
  <main>
    <slot name="main"><p>Turning the pages…</p></slot>
  </main>
  <aside>
    <slot name="side"></slot>
  </aside>
  <slot name="debug" float></slot>
</body>
</html>
