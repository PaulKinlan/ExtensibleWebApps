<!doctype html>
<!--
  Beat pad: a drum machine made of plugins. Press Space (or ▶) to play.

  sequencer.js  owns the patterns; draws sixteen steps by six voices, runs
                the clock and plays every hit, synthesised in an AudioWorklet
  euclid.js     a menu beside each row that spreads hits evenly, through the
                sequencer's own command, so nothing needs reviewing
  ripples.js    the pattern as a radar on a canvas, drawn in its own worker,
                kept in time by the sequencer's transport record alone

  Customize offers Drums only (a transform hiding the melodic rows) and a
  Sunset theme. The command palette (Ctrl K, Cmd K on a Mac) lists the
  transport's commands and their keys.

  The page is dark in both colour schemes: it's a piece of hardware. Its
  colours sit in @layer platform, so a theme plugin still wins over them.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Beat pad</title>
  <meta name="description" content="A sixteen-step drum machine, every sound synthesised in an AudioWorklet, made of plugins.">
  <meta name="gallery" content="showcase">
  <meta name="gallery-about" content="A sixteen-step drum machine with glowing pads, every sound synthesised in an AudioWorklet. A Euclidean rhythm menu and a radar on a canvas are separate plugins, kept in time through shared data.">
  <meta name="gallery-shows" content="audio, a canvas in a worker, fast redraws, commands with keys.">
  <link rel="stylesheet" href="/platform/host.css">
  <script type="module" src="/platform/host.js"></script>
  <link rel="plugin" href="sequencer.js">
  <link rel="plugin" href="euclid.js">
  <link rel="plugin" href="ripples.js">
  <link rel="plugin-sample" href="samples/drums-only.js" title="Drums only">
  <link rel="plugin-sample" href="samples/sunset.js" title="Sunset theme">
  <link rel="plugin" href="/std/commands/palette.js">
  <style>
    @layer platform {
      :root {
        color-scheme: dark;
        --bg: #0b0b12;
        --bg-2: #14141f;
        --surface: #191927;
        --fg: #f1f0ff;
        --fg-2: #9b99b8;
        --border: #2a2a3d;
        --accent: #9effc7;
        --accent-fg: #0b0b12;
        --radius: 10px;
      }
    }
    body {
      background:
        radial-gradient(50rem 28rem at 15% -5%, rgb(255 93 143 / 0.16), transparent 60%),
        radial-gradient(46rem 30rem at 95% 10%, rgb(94 180 255 / 0.14), transparent 60%),
        radial-gradient(40rem 30rem at 50% 110%, rgb(177 140 255 / 0.12), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      grid-template-columns: minmax(0, 1fr) minmax(0, 360px);
    }
    body > header { align-items: center; background: transparent; border-bottom: 0; }
    body > header h1 { font-size: 1.15rem; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; }
    body > header h1::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: #ff5d8f; box-shadow: 18px 0 #ffb547, 36px 0 #5ef0c9, 54px 0 #b18cff; margin-right: 58px; }
    body > header nav.site { margin-left: auto; }
    body > header nav.site a { color: var(--fg-2); text-decoration: none; }
    body > header nav.site a:hover { color: var(--accent); }
    body > aside { border-left: 0; }
    /* The radar's canvas is drawn at twice its size; show it at the column's width. */
    [data-plugin="ripples"] canvas { width: 100%; height: auto; aspect-ratio: 1; display: block; }
    [data-plugin="ripples"] h2, [data-plugin="ripples"] h3 { font-size: var(--text-sm); text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-2); margin: 0; }
    .hint { color: var(--fg-2); font-size: var(--text-sm); margin: 0; }
    .hint kbd { font: 600 0.75rem var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-2); }
    @media (max-width: 800px) {
      body { grid-template-columns: minmax(0, 1fr); }
      body > header nav.site { margin-left: 0; width: 100%; }
      body > main { padding: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Beat pad</h1>
    <slot name="commands"></slot>
    <nav class="site" aria-label="This site">
      <a href="/">Home</a>
      <a href="/demos/">All demos</a>
      <a href="/docs/">Docs</a>
      <a href="/workbench/">Workbench</a>
    </nav>
  </header>
  <main>
    <slot name="main"><p>Warming up the oscillators…</p></slot>
    <p class="hint">Press <kbd>Space</kbd> to play or stop. Tap a pad to add a hit; the <strong>E</strong> menu beside a row spreads hits evenly.</p>
  </main>
  <aside>
    <slot name="side"></slot>
  </aside>
</body>
</html>
