<!--
  The Euclid menu beside each row. euclid.js sends { track, marked, choices: [{ n }] }; marked flips after each pick so the menu goes back to "E".
  Picking a number sends "euclid:<track>" with it.
-->
<style>
  .euclid { height: 22px; max-width: 2.6rem; padding: 0 2px; font-weight: 600; font-size: var(--text-xs); font-family: var(--mono); color: var(--fg-2); background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; }
  .euclid:hover, .euclid:focus { color: var(--fg); border-color: var(--accent); }
</style>
<template id="menu">
  <select class="euclid" data-action="euclid:{{track}}" aria-label="Spread hits evenly across the {{track}} row" title="Euclidean rhythm: spread N hits evenly">
    <option value="" selected="{{marked}}">E</option>
    <template for="c of choices"><option value="{{c.n}}">{{c.n}} in 16</option></template>
  </select>
</template>
