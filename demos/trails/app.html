<!doctype html>
<!--
  Trails: a training log, made of plugins.

  activities.js  owns the log; a feed of activity cards with route pictures,
                 and a form to log one
  year.js        a year of activity as a heatmap, a square a day
  weekly.js      twelve weeks of distance, stacked by kind, on a canvas
                 drawn in its own worker
  bests.js       this month, and personal records, from the log

  Customize offers Miles, a transform that shows every distance in miles,
  and a Forest theme.

  Each plugin draws in a slot of its own name, so the page decides the
  layout: the year across the top, the chart and the feed below it, the
  bests at the side.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Trails</title>
  <meta name="description" content="A training log: a year heatmap, weekly chart, personal bests and a feed of activities.">
  <link rel="stylesheet" href="/platform/host.css">
  <script type="module" src="/platform/host.js"></script>
  <link rel="plugin" href="activities.js">
  <link rel="plugin" href="year.js">
  <link rel="plugin" href="weekly.js">
  <link rel="plugin" href="bests.js">
  <link rel="plugin-sample" href="samples/miles.js" title="Miles">
  <link rel="plugin-sample" href="samples/forest.js" title="Forest theme">
  <link rel="plugin" href="/std/commands/palette.js">
  <style>
    @layer platform {
      :root {
        --bg: light-dark(#f7f5f2, #121110);
        --bg-2: light-dark(#efebe5, #1b1a18);
        --surface: light-dark(#ffffff, #1f1d1b);
        --fg: light-dark(#1c1917, #f5f2ee);
        --fg-2: light-dark(#78716c, #a8a29e);
        --border: light-dark(#e7e2db, #2e2b28);
        --accent: light-dark(#ea580c, #fb923c);
        --accent-fg: light-dark(#fff, #1c1917);
        --radius: 12px;
        --radius-lg: 18px;
      }
    }
    body {
      background:
        radial-gradient(56rem 26rem at 10% -8%, light-dark(rgb(251 146 60 / 0.16), rgb(234 88 12 / 0.14)), transparent 60%),
        radial-gradient(44rem 26rem at 100% 0%, light-dark(rgb(219 39 119 / 0.1), rgb(219 39 119 / 0.1)), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      grid-template-columns: minmax(0, 1fr) minmax(0, 340px);
    }
    body > header { align-items: center; background: transparent; border-bottom: 0; padding-top: 18px; }
    body > header h1 { font-size: 1.4rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
    body > header h1::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(from 30deg, #f97316, #db2777, #7c3aed, #0ea5e9, #16a34a, #f97316); mask: radial-gradient(circle, transparent 6px, #000 7px); }
    body > header nav.site { margin-left: auto; }
    body > header nav.site a { color: var(--fg-2); text-decoration: none; }
    body > header nav.site a:hover { color: var(--accent); }
    body > aside { border-left: 0; }
    .chart { padding: var(--space-4) var(--space-5); border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); }
    [data-plugin="weekly"] h2, [data-plugin="weekly"] h3 { margin: 0 0 8px; font-size: var(--text-xl); letter-spacing: -0.01em; }
    [data-plugin="weekly"] canvas { width: 100%; height: auto; aspect-ratio: 1200 / 440; display: block; }
    .chart .key { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 0; padding: 0; list-style: none; font-size: var(--text-sm); color: var(--fg-2); }
    .chart .key li::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
    @media (max-width: 720px) {
      body { grid-template-columns: minmax(0, 1fr); }
      body > header nav.site { margin-left: 0; width: 100%; }
      .chart { padding: var(--space-3); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Trails</h1>
    <slot name="commands"></slot>
    <nav class="site" aria-label="This site">
      <a href="/">Home</a>
      <a href="/demos/">All demos</a>
      <a href="/docs/">Docs</a>
      <a href="/workbench/">Workbench</a>
    </nav>
  </header>
  <main>
    <slot name="year"><p>Counting the kilometres…</p></slot>
    <section class="chart">
      <slot name="weeks"></slot>
      <ul class="key" aria-label="Colours">
        <li style="--c:#f97316">Run</li>
        <li style="--c:#0ea5e9">Ride</li>
        <li style="--c:#16a34a">Hike</li>
        <li style="--c:#8b5cf6">Swim</li>
      </ul>
    </section>
    <slot name="main"></slot>
  </main>
  <aside>
    <slot name="side"></slot>
  </aside>
</body>
</html>
