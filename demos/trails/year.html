<!--
  The heatmap. year.js sends { days: [{ date, level, title, today }],
  months: [{ name, week }], active, total, longest, current, legend }.
  data-level picks the colour; data-week on a month label picks its column,
  with the same typed attr() trick as the board's pulse:
  grid-column-start: attr(data-week type(<integer>)).
-->
<style>
  .year { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); }
  .year-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-5); }
  .year-head h2 { margin: 0 auto 0 0; font-size: var(--text-xl); letter-spacing: -0.01em; }
  .figure { display: flex; flex-direction: column; }
  .figure strong { font-weight: 700; font-size: var(--text-xl); line-height: 1; font-family: var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .figure small { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-2); }
  .scroll { overflow-x: auto; padding-bottom: var(--space-1); }
  .months, .days { display: grid; grid-template-columns: repeat(53, 13px); gap: 3px; width: max-content; }
  .months { height: 16px; font-size: var(--text-xs); color: var(--fg-2); }
  .months span { grid-row: 1; grid-column-start: attr(data-week type(<integer>), auto); white-space: nowrap; }
  .days { grid-template-rows: repeat(7, 13px); grid-auto-flow: column; }
  .day { width: 13px; height: 13px; border-radius: 3px; background: var(--heat-0); }
  .day[data-level="1"] { background: var(--heat-1); }
  .day[data-level="2"] { background: var(--heat-2); }
  .day[data-level="3"] { background: var(--heat-3); }
  .day[data-level="4"] { background: var(--heat-4); }
  .day[data-today] { outline: 2px solid var(--fg); outline-offset: 1px; }
  .year { --heat-0: color-mix(in srgb, var(--fg) 7%, transparent); --heat-1: color-mix(in srgb, var(--heat) 30%, transparent); --heat-2: color-mix(in srgb, var(--heat) 55%, transparent); --heat-3: color-mix(in srgb, var(--heat) 80%, transparent); --heat-4: var(--heat); --heat: light-dark(#ea580c, #fb923c); } /* design-ok: the app's own palette */
  .legend { display: flex; align-items: center; gap: 3px; margin-left: auto; font-size: var(--text-xs); color: var(--fg-2); }
  .legend .day { display: inline-block; }
  .legend span:first-child { margin-right: var(--space-1); }
  .legend span:last-child { margin-left: var(--space-1); }
  .foot { display: flex; align-items: center; gap: var(--space-3); color: var(--fg-2); font-size: var(--text-sm); }
</style>

<template id="year">
  <section class="year" aria-label="The year">
    <div class="year-head">
      <h2>The year</h2>
      <div class="figure"><strong>{{total}}</strong><small>km</small></div>
      <div class="figure"><strong>{{active}}</strong><small>active days</small></div>
      <div class="figure"><strong>{{longest}}</strong><small>longest streak</small></div>
      <div class="figure"><strong>{{current}}</strong><small>current streak</small></div>
    </div>
    <div class="scroll">
      <div class="months" aria-hidden="true">
        <template for="m of months"><span data-week="{{m.week}}">{{m.name}}</span></template>
      </div>
      <div class="days" role="img" aria-label="{{active}} active days in the last year">
        <template for="d of days"><span class="day" key="{{d.date}}" data-level="{{d.level}}" data-today="{{d.today}}" title="{{d.title}}"></span></template>
      </div>
    </div>
    <div class="foot">
      <span>Darker squares, further that day.</span>
      <span class="legend" aria-hidden="true"><span>Less</span><template for="x of legend"><span class="day" data-level="{{x.l}}"></span></template><span>More</span></span>
    </div>
  </section>
</template>
