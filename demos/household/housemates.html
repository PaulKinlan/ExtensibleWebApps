<!--
  Who lives here. housemates.js sends { shared, me, others }: shared is true
  in a space, me is the name on this person's account there, and others are
  the names of everyone else in the space, joined with commas.
-->
<style>
  .who { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: baseline; margin-block-end: var(--space-3); }
  .who p { margin: 0; }
</style>
<template id="who">
  <section class="who" aria-label="Who lives here">
    <template if="me">
      <p>You're <strong>{{me}}</strong><template if="others"> · also here: {{others}}</template></p>
    </template>
    <template if="shared">
      <template if="!me"><p><small>Connecting to the space…</small></p></template>
    </template>
    <template if="!shared">
      <p><small>Just you on this device. Share it with a space to see who did what.</small></p>
    </template>
  </section>
</template>
