<!--
  The chores. chores.js sends { chores, form, canAdd, why }: each chore is
  { id, name, often, when, tone, last, today, canDo, canRemove }, already
  sorted with what's overdue first and worded, so the template only lays it
  out. "Done" is drawn only for a chore not done today, and each button only
  for someone who may press it in this space (`why` says so to a reader).
  form is a key that changes after each add.
-->
<style>
  .chores ul { display: grid; gap: var(--space-2); margin: 0 0 var(--space-3); padding: 0; list-style: none; }
  .chores li { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-2) 0; border-block-end: 1px solid var(--border); }
  .chores .what { flex: 1 1 12rem; display: grid; gap: 2px; }
  .chores .last, .chores .often { color: var(--fg-2); font-size: var(--text-sm); }
  .chores form { flex-direction: row; flex-wrap: wrap; gap: var(--space-2); }
  .chores form input { flex: 1 1 10rem; min-width: 0; }
</style>
<template id="list">
  <div class="chores">
    <h2>Chores</h2>
    <template if="chores.length">
      <ul>
        <template for="c of chores">
          <li key="{{c.id}}">
            <div class="what">
              <strong>{{c.name}}</strong>
              <span class="often">{{c.often}}</span>
              <template if="c.last"><span class="last">{{c.last}}</span></template>
            </div>
            <ui-badge tone="{{c.tone}}">{{c.when}}</ui-badge>
            <template if="c.canDo"><button type="button" data-action="done:{{c.id}}">Done</button></template>
            <template if="c.canRemove"><button type="button" data-action="remove:{{c.id}}" aria-label="Remove {{c.name}}" title="Remove">✕</button></template>
          </li>
        </template>
      </ul>
    </template>
    <template if="!chores.length"><p><small>No chores. Lucky you.</small></p></template>
    <template if="why"><p class="why"><small>{{why}}</small></p></template>
    <template if="canAdd">
    <form data-action="add" key="{{form}}">
      <input name="name" placeholder="A chore" aria-label="Chore" maxlength="80" autocomplete="off" required>
      <select name="every" aria-label="How often">
        <option value="1">Daily</option>
        <option value="3">Every 3 days</option>
        <option value="7" selected>Weekly</option>
        <option value="14">Fortnightly</option>
        <option value="30">Monthly</option>
      </select>
      <button type="submit">Add</button>
    </form>
    </template>
  </div>
</template>
