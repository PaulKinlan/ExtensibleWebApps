<!--
  The shopping list. groceries.js sends { toGet, got, empty, form }: each item
  is { id, item, got, added, gotBy }, with "you" for this device's person.
  Each checkbox's data-action is "got:" and the item's id, and each row has a
  key, so a ticked item moves to the bottom with its own checkbox. form is a
  key that changes after each add, so the field is drawn empty again.
-->
<style>
  .groceries ul { display: grid; gap: var(--space-1, 4px); margin: 0 0 var(--space-3); padding: 0; list-style: none; }
  .groceries li label { display: flex; gap: var(--space-2); align-items: baseline; padding: var(--space-2) 0; min-height: 2.5rem; }
  .groceries li input { flex: none; inline-size: 1.25rem; block-size: 1.25rem; }
  .groceries .who { color: var(--fg-2); font-size: var(--text-sm); }
  .groceries .got { color: var(--fg-2); }
  .groceries form { flex-direction: row; gap: var(--space-2); }
  .groceries form input { flex: 1; min-width: 0; }
</style>
<template id="list">
  <div class="groceries">
    <h2>Shopping list</h2>
    <form data-action="add" key="{{form}}">
      <input name="item" placeholder="Something we need" aria-label="Item" maxlength="120" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <template if="toGet.length">
      <ul aria-label="To get">
        <template for="i of toGet">
          <li key="{{i.id}}">
            <label>
              <input type="checkbox" data-action="got:{{i.id}}">
              <span>{{i.item}} <template if="i.added"><span class="who">· {{i.added}} added it</span></template></span>
            </label>
          </li>
        </template>
      </ul>
    </template>
    <template if="!toGet.length"><p><small>Nothing to get.</small></p></template>
    <template if="got.length">
      <h3>In someone's basket</h3>
      <ul aria-label="Got">
        <template for="i of got">
          <li key="{{i.id}}" class="got">
            <label>
              <input type="checkbox" checked="{{i.got}}" data-action="got:{{i.id}}">
              <span><s>{{i.item}}</s> <template if="i.gotBy"><span class="who">· {{i.gotBy}} got it</span></template></span>
            </label>
          </li>
        </template>
      </ul>
      <button type="button" data-action="clear">Clear what's been got</button>
    </template>
  </div>
</template>
