<!doctype html>
<!--
  Recipes: an app made of three plugins, each its own file.

  cookbook.js  owns the `recipes` collection: the form, the list, and the
               open recipe, scaled to however many people you're feeding
  shopping.js  owns the `shopping` list; it reads the recipes, and adds a
               recipe's ingredients when you ask
  quick.js     reads the recipes and lists the ones you can make in time
  timer.js     fills the room the open recipe leaves for other plugins (a
               declared slot) with a timer for that recipe

  The plugins don't call each other. shopping.js shows its own "Add to the
  list" buttons beside each recipe, from the same collection.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes</title>
  <meta name="description" content="Recipes, scaled to fit, and a shopping list.">
  <link rel="stylesheet" href="/platform/host.css">
  <script type="module" src="/platform/host.js"></script>
  <link rel="plugin" href="cookbook.js">
  <link rel="plugin" href="shopping.js">
  <link rel="plugin" href="quick.js">
  <link rel="plugin" href="timer.js">
  <!-- A standard plugin: a bug button that shows errors and the trace, to copy into a bug report. -->
  <link rel="plugin" href="/std/debug-console.js">
</head>
<body>
  <header>
    <h1>Recipes</h1>
    <nav class="site" aria-label="This site">
      <a href="/">Home</a>
      <a href="/demos/">All demos</a>
      <a href="/docs/">Docs</a>
      <a href="/workbench/">Workbench</a>
    </nav>
  </header>
  <main>
    <slot name="main"><p>Opening the cookbook…</p></slot>
  </main>
  <aside>
    <slot name="side"></slot>
  </aside>
  <slot name="debug"></slot>
</body>
</html>
