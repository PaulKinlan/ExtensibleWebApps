<!--
  The countdown. The image is a file next to this one, so it loads from
  wherever the plugin lives, without the network permission.
-->
<style>
  .countdown { display: flex; align-items: center; gap: var(--space-3); margin: 0 0 var(--space-4); padding: var(--space-2) var(--space-3); border-radius: var(--radius); background: var(--bg-2); }
  .countdown strong { font-size: var(--text-lg); }
</style>
<template id="days-left">
  <p class="countdown"><img src="tram.svg" alt="" width="40" height="40"><strong>{{words}}</strong></p>
</template>
<template id="missing">
  <p class="countdown">This page doesn't say when the trip starts.</p>
</template>
