<!--
  Pulse. pulse.js sends { pct, shipped, total, doing, late, count, flow:
  [{ id, title, n }], people: [{ name, initial, cards, points, max }] }.

  Sizes come from the data, as custom properties in a style attribute (the
  only thing a view's style may set): --pct is how far round the ring goes,
  and --n how wide each flow segment is.
-->
<style>
  .pulse { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); }
  .pulse h2 { margin: 0; font-size: var(--text-md); }
  .pulse h3 { margin: 0 0 var(--space-2); font-size: var(--text-sm); color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.06em; }
  .hero { display: flex; align-items: center; gap: var(--space-4); }
  .ring {
    flex: none; display: grid; place-items: center; width: 92px; aspect-ratio: 1; border-radius: 50%;
    background:
      radial-gradient(closest-side, var(--surface) 76%, transparent 77%),
      conic-gradient(from -90deg, #34d399, #22d3ee calc(var(--pct, 0) * 1%), color-mix(in srgb, var(--fg) 10%, transparent) 0);
  }
  .ring strong { font-weight: 700; font-size: var(--text-xl); font-family: var(--font); }
  .ring strong small { font-size: 0.55em; color: var(--fg-2); }
  .hero p { margin: 0; color: var(--fg-2); font-size: var(--text-sm); }
  .hero p strong { color: var(--fg); font-size: var(--text-lg); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .stats ui-stat { padding: var(--space-2) var(--space-3); border-radius: var(--radius); background: var(--bg-2); }
  .flow { display: flex; height: 12px; gap: 3px; border-radius: 999px; overflow: hidden; }
  .flow span { flex: var(--n, 1) 1 0; min-width: 0; background: var(--stage); }
  .flow span[data-n="0"] { display: none; }
  .key { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); margin: var(--space-2) 0 0; padding: 0; list-style: none; font-size: var(--text-sm); color: var(--fg-2); }
  .key li::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--stage); }
  [data-stage="ideas"] { --stage: #a78bfa; }
  [data-stage="next"] { --stage: #60a5fa; }
  [data-stage="doing"] { --stage: #f59e0b; }
  [data-stage="review"] { --stage: #f472b6; }
  [data-stage="done"] { --stage: #34d399; }
  .team { display: flex; flex-direction: column; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
  .team li { display: grid; grid-template-columns: auto 4.5rem minmax(0, 1fr) auto; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
  .team meter { width: 100%; height: 8px; }
  .team meter::-webkit-meter-bar { height: 8px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--fg) 10%, transparent); }
  .team meter::-webkit-meter-optimum-value { border-radius: 999px; background: var(--person); }
  .team .pts { font-weight: 600; font-size: 0.75rem; font-family: var(--mono); color: var(--fg-2); }
  .avatar { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-weight: 700; font-size: 0.7rem; font-family: var(--font); color: #fff; background: var(--person); }
  [data-person="Mei"] { --person: linear-gradient(135deg, #f472b6, #8b5cf6); }
  [data-person="Kofi"] { --person: linear-gradient(135deg, #34d399, #0ea5e9); }
  [data-person="Ines"] { --person: linear-gradient(135deg, #fbbf24, #f97316); }
  [data-person="Rafa"] { --person: linear-gradient(135deg, #60a5fa, #6366f1); }
  [data-person="Sam"] { --person: linear-gradient(135deg, #a3e635, #14b8a6); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>

<template id="pulse">
  <section class="pulse" aria-label="Pulse">
    <h2>Pulse</h2>
    <div class="hero">
      <div class="ring" style="--pct: {{pct}}" role="img" aria-label="{{pct}}% of points shipped"><strong>{{pct}}<small>%</small></strong></div>
      <p><strong>{{shipped}}</strong> of {{total}} points shipped across {{count}} cards.</p>
    </div>
    <div class="stats">
      <ui-stat label="In progress" value="{{doing}}"></ui-stat>
      <ui-stat label="Overdue" value="{{late}}" tone="{{lateTone}}"></ui-stat>
    </div>
    <div>
      <h3>Flow</h3>
      <div class="flow" aria-hidden="true">
        <template for="s of flow"><span data-stage="{{s.id}}" data-n="{{s.n}}" style="--n: {{s.n}}" title="{{s.title}}: {{s.n}}"></span></template>
      </div>
      <ul class="key">
        <template for="s of flow"><li data-stage="{{s.id}}">{{s.title}} {{s.n}}</li></template>
      </ul>
    </div>
    <div>
      <h3>Who has what</h3>
      <ul class="team">
        <template for="p of people">
          <li data-person="{{p.name}}">
            <span class="avatar" data-person="{{p.name}}">{{p.initial}}</span>
            <span>{{p.name}}</span>
            <meter min="0" max="{{p.max}}" value="{{p.points}}">{{p.points}} points</meter>
            <span class="pts">{{p.points}} pt</span>
          </li>
        </template>
      </ul>
    </div>
  </section>
</template>
