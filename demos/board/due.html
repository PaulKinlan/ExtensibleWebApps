<!--
  The due badge. due.js sends { text, tone, date }: tone is late, soon, near
  or calm, and the CSS picks the colour from data-tone.
-->
<style>
  .due { display: inline-flex; align-items: center; gap: var(--space-1); padding: 1px var(--space-2); border-radius: 999px; font-size: var(--text-xs); font-weight: 600; white-space: nowrap; color: var(--fg-2); background: var(--bg-2); }
  .due::before { content: "◷"; font-size: 0.85em; }
  .due[data-tone="near"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .due[data-tone="soon"] { color: var(--warn); background: color-mix(in srgb, var(--warn) 18%, transparent); }
  .due[data-tone="late"] { color: var(--bg); background: var(--danger); }
  .due[data-tone="late"]::before { content: "!"; font-weight: 800; }
</style>
<template id="due">
  <time class="due" datetime="{{date}}" data-tone="{{tone}}">{{text}}</time>
</template>
