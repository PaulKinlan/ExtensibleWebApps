<!doctype html>
<!--
  Studio board: a project board, made of plugins, built to see how far the
  platform's UI goes. Each plugin is one file, with its views in a template
  file next to it.

  board.js      owns the cards; draws the board, and each card on its own
                screen at card/<id>, with rooms on both for other plugins
  due.js        a "Due tomorrow" badge in each card's room, from the slot's
                data alone: it can't read a single card
  checklist.js  owns the steps; a "2/5" in each card's room, and the whole
                checklist in the room on the card's screen
  wip.js        a transform: adds a limit gauge to the board's column headers
  pulse.js      reads the cards and draws progress, flow and who has what

  Customize (bottom left) offers two more a person can add: Focus, a
  transform that hides two columns, and Midnight, a theme.

  The page's look is set here. The colours are set inside @layer platform,
  the same layer as the platform's defaults, so they replace those defaults
  but a theme plugin (in the plugins layer above) can still replace them.
  The layout is outside any layer, so it always wins.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Studio board</title>
  <meta name="description" content="A project board with rich cards, checklists, due dates and limits, each a plugin.">
  <meta name="gallery" content="showcase">
  <meta name="gallery-about" content="A project board with covers, labels and people. Due dates, checklists and limits are separate plugins that add to the board's cards and columns, and each card has its own screen.">
  <meta name="gallery-shows" content="slots in a view, transforms, screens, commands, a theme.">
  <link rel="stylesheet" href="/platform/host.css">
  <script type="module" src="/platform/host.js"></script>
  <link rel="plugin" href="board.js">
  <link rel="plugin" href="due.js">
  <link rel="plugin" href="checklist.js">
  <link rel="plugin" href="wip.js">
  <link rel="plugin" href="pulse.js">
  <link rel="plugin-sample" href="samples/focus.js" title="Focus">
  <link rel="plugin-sample" href="samples/midnight.js" title="Midnight theme">
  <!-- A standard plugin: Ctrl K (Cmd K on a Mac) searches the board's commands. -->
  <link rel="plugin" href="/std/commands/palette.js">
  <style>
    @layer platform {
      :root {
        --bg: light-dark(#f6f5fb, #0f0f17);
        --bg-2: light-dark(#eeedf6, #181824);
        --surface: light-dark(#ffffff, #1d1d2b);
        --fg: light-dark(#191827, #ecebf5);
        --fg-2: light-dark(#6b6a80, #a19fb8);
        --border: light-dark(#e3e1ee, #2c2b3d);
        --accent: light-dark(#6d4aff, #a78bfa);
        --accent-fg: light-dark(#fff, #14111f);
        --radius: 10px;
        --radius-lg: 16px;
        --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
    }

    body {
      background:
        radial-gradient(60rem 30rem at 0% -10%, light-dark(rgb(167 139 250 / 0.18), rgb(124 58 237 / 0.16)), transparent 60%),
        radial-gradient(50rem 30rem at 100% 0%, light-dark(rgb(56 189 248 / 0.14), rgb(14 165 233 / 0.12)), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      grid-template-columns: minmax(0, 1fr) minmax(0, 320px);
    }
    body > header {
      align-items: center;
      background: color-mix(in srgb, var(--bg) 70%, transparent);
      backdrop-filter: blur(12px);
      border-bottom-color: color-mix(in srgb, var(--border) 60%, transparent);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 28px; height: 28px; border-radius: 8px; background: conic-gradient(from 200deg, #a78bfa, #60a5fa, #34d399, #f59e0b, #f472b6, #a78bfa); box-shadow: 0 4px 12px -4px rgb(109 74 255 / 0.6); }
    body > header h1 { font-size: 1.05rem; letter-spacing: -0.01em; }
    .sprint { font-size: var(--text-sm); color: var(--fg-2); }
    .sprint b { color: var(--fg); font-weight: 600; }
    body > header nav.site { margin-left: auto; }
    body > header nav.site a { color: var(--fg-2); text-decoration: none; font-weight: 500; }
    body > header nav.site a:hover { color: var(--accent); }
    body > main { padding-right: 0; }
    body > aside { border-left: 0; }
    @media (max-width: 800px) {
      body { grid-template-columns: minmax(0, 1fr); }
      body > header nav.site { margin-left: 0; width: 100%; }
      body > main { padding: 12px 0 12px 12px; }
      body > aside { padding: 0 12px 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>Studio board</h1>
        <div class="sprint"><b>Aurora 2.0</b> · weather app redesign</div>
      </div>
    </div>
    <slot name="commands"></slot>
    <nav class="site" aria-label="This site">
      <a href="/">Home</a>
      <a href="/demos/">All demos</a>
      <a href="/docs/">Docs</a>
      <a href="/workbench/">Workbench</a>
    </nav>
  </header>
  <main>
    <slot name="main"><p>Pinning up the cards…</p></slot>
  </main>
  <aside>
    <slot name="side"></slot>
  </aside>
</body>
</html>
