<!doctype html>
<!--
  The reading list: an app made of four plugins, each its own file.

  library.js     owns the `library` collection, and draws the form and table
  due-soon.js    reads the library and lists books due back soon
  book-import.js adds books from a pasted list; the library isn't its own,
                 so the person reviews each change
  book-page.js   shows one book on its own screen, at book/<id>, so a
                 book has an address to bookmark or share
  book-files.js  adds an ebook (.pdf, .epub) opened with the app (once it is
                 installed) as a book to read; manifest.webmanifest's
                 file_handlers make it a place to open them
  book-share.js  adds a page shared to the app (once it is installed) as a
                 book to read; manifest.webmanifest makes it a share target
  outside-agents.js  lets agents outside the app (WebMCP in the browser, MCP on
                 a space's server) read the library and ask to change it

  It also links two standard plugins: a debug console, and a command palette
  that lists the commands library.js adds.

  The plugins never call each other. They meet in the collection: when one
  writes a book, the others hear `data:changed:library` and redraw (due-soon.js
  draws live, so it redraws by itself).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading list</title>
  <meta name="description" content="Books to read, and when they're due back.">
  <meta name="gallery" content="slots">
  <meta name="gallery-about" content="Books to read, and when they're due back. One plugin owns the books, another lists the ones due soon, and an importer asks before it adds any.">
  <meta name="gallery-shows" content="collections, review, screens with their own address, sharing.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="/platform/host.css">
  <script type="module" src="/platform/host.js"></script>
  <link rel="plugin" href="library.js">
  <link rel="plugin" href="due-soon.js">
  <link rel="plugin" href="book-import.js">
  <link rel="plugin" href="book-page.js">
  <link rel="plugin" href="book-files.js">
  <link rel="plugin" href="book-share.js">
  <link rel="plugin" href="outside-agents.js">
  <!-- A plugin the person may add themselves, in Customize; it draws in a place, as the app has no slot for it. -->
  <link rel="plugin-sample" href="samples/goal.js" title="Reading goal">
  <!-- A standard plugin: opened in a space (/s/<space>/…), whether this page reaches it, and the drafts it kept. -->
  <link rel="plugin" href="/std/sync.js">
  <!-- A standard plugin: a bug button that shows errors and the trace, to copy into a bug report. -->
  <link rel="plugin" href="/std/debug-console.js">
  <!-- A standard plugin: Ctrl K (Cmd K on a Mac) searches what the plugins can do, such as library.js's commands. -->
  <link rel="plugin" href="/std/commands/palette.js">
</head>
<body>
  <header>
    <h1>Reading list</h1>
    <nav class="site" aria-label="This site">
      <a href="/">Home</a>
      <a href="/demos/">All demos</a>
      <a href="/docs/">Docs</a>
      <a href="/workbench/">Workbench</a>
    </nav>
    <slot name="commands"></slot>
  </header>
  <main>
    <slot name="sync"></slot>
    <slot name="main"><p>Loading your books…</p></slot>
  </main>
  <aside>
    <slot name="side"></slot>
  </aside>
  <slot name="debug" float></slot>
</body>
</html>
