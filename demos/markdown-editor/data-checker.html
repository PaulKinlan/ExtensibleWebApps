<!--
  The Claims panel: { open, count, claims: [{ i, kind, line, value, context }] }.
  Check sends check:<i>, which asks the writer agent to check that claim.
-->
<style>
  .claims ol { margin: 0; padding-inline-start: var(--space-5); display: grid; gap: var(--space-2); }
  .claims .kind { font-size: var(--text-xs, 0.75rem); text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-2); }
  .claims .context { color: var(--fg-2); font-size: var(--text-sm); }
  .claims p { margin: 0; color: var(--fg-2); }
  .claims .value { display: flex; gap: var(--space-2); align-items: baseline; justify-content: space-between; }
</style>
<template id="claims">
  <template if="open">
    <ui-card class="claims">
      <h3>Claims</h3>
      <template if="count"><p>{{count}} things to check. Check asks the writer to verify one.</p></template>
      <template if="!count"><p>No numbers, dates or quotes found.</p></template>
      <ol>
        <template for="c of claims">
          <li key="{{c.i}}">
            <span class="kind">{{c.kind}} · line {{c.line}}</span>
            <div class="value"><strong>{{c.value}}</strong><button type="button" data-action="check:{{c.i}}">Check</button></div>
            <span class="context">{{c.context}}</span>
          </li>
        </template>
      </ol>
    </ui-card>
  </template>
</template>
