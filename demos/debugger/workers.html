<!--
  The workers panel. workers.js sends { tabs, count, none }: each tab is
  { tab, path, spawner, mine, workers: [{ instance, name, shared, hooks }] },
  the workers its page started.
-->
<style>
  .tabs { display: grid; gap: var(--space-2); grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  .tab h3 { margin: 0 0 var(--space-1); font-size: var(--text-base); display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; }
  .tab h3 code { overflow-wrap: anywhere; }
  .tab ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: var(--text-sm); }
  .tab li { display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; }
  .tab li code { color: var(--fg-2); }
  .muted { color: var(--fg-2); font-size: var(--text-sm); }
</style>
<template id="workers">
  <section aria-label="Workers">
    <h2>Workers <ui-badge>{{count}}</ui-badge></h2>
    <p class="muted">Each plugin runs in a worker of its own. Shared plugins run once, in the spawner tab; tab plugins run once per tab.</p>
    <template if="none"><ui-empty heading="No workers running"></ui-empty></template>
    <div class="tabs">
      <template for="t of tabs">
        <ui-card class="tab" key="{{t.tab}}">
          <h3><code>{{t.path}}</code> <template if="t.spawner"><ui-badge tone="ok">spawner</ui-badge></template> <template if="t.mine"><ui-badge>this debugger</ui-badge></template></h3>
          <ul>
            <template for="w of t.workers">
              <li key="{{w.instance}}"><strong>{{w.name}}</strong> <code>{{w.instance}}</code> <template if="w.shared"><ui-badge tone="accent">shared</ui-badge></template> <span class="muted">{{w.hooks}} hooks</span></li>
            </template>
          </ul>
          <template if="!t.workers.length"><p class="muted">Starts no workers.</p></template>
        </ui-card>
      </template>
    </div>
  </section>
</template>
