<!--
  The habit list. habits.js sends { habits }, each { id, name, today, streak }:
  streak is text ("3 days"), or 0 when there is none.

  checked="{{h.today}}" is one whole hole, so the box is ticked only when
  the habit is done today. The <style> is this plugin's own: the host scopes
  it to these views, under the page's own styles.
-->
<style>
  .habits { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
  .habit { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .habit label { flex: 1; display: flex; align-items: center; gap: var(--space-2); }
  .habit[data-done] { border-color: var(--ok); }
</style>
<template id="habits">
  <h2>Today</h2>
  <template if="habits.length">
    <ul class="habits">
      <template for="h of habits">
        <li class="habit" key="{{h.id}}" data-done="{{h.today}}">
          <label><input type="checkbox" checked="{{h.today}}" data-action="tick:{{h.id}}"> {{h.name}}</label>
          <template if="h.streak"><ui-badge tone="ok">{{h.streak}}</ui-badge></template>
        </li>
      </template>
    </ul>
  </template>
  <template if="!habits.length"><ui-empty heading="No habits yet"><p>Add one below.</p></ui-empty></template>
  <ui-card>
    <h3>Add a habit</h3>
    <ui-form collection="habits" fields="name" submit="Add habit"></ui-form>
  </ui-card>
</template>
