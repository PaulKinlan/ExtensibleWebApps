<!--
  The timeline's views (timeline.js), either side of its canvas. Both get
  { has, name, mixes: [{ id, name, current }], noMixes, clips: [{ id, name }],
  noClips, full, tracks: [{ key, n, name, at, gain, gainShown, pan, panShown,
  mute, missing, seconds }], empty, length, playing, noTracks, noPlay, status }.

  Every control sends its data-action: a track's carry its key
  (track-gain:<key>, nudge:<key>:back…), with the value set. n is the
  track's colour on the canvas: the swatch's class.
-->
<style>
  .timeline { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--border); }
  .timeline h2 { margin: 0; font-size: var(--text-lg); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: end; }
  .row label { display: flex; flex-direction: column; gap: 2px; font-size: var(--text-sm); color: var(--fg-2); }
  .timeline form { display: flex; flex-direction: row; flex-wrap: wrap; gap: var(--space-2); align-items: end; justify-content: flex-start; justify-items: start; }
  .timeline input[type="number"] { width: 6.5rem; }
  .play { min-width: 8rem; }
  .muted { color: var(--fg-2); font-size: var(--text-sm); margin: 0; }
  .status { min-height: 1.5em; margin: 0; color: var(--fg-2); font-size: var(--text-sm); }
  .tracks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .track { display: grid; grid-template-columns: minmax(8rem, 1.2fr) auto minmax(8rem, 1fr) minmax(8rem, 1fr) auto; gap: var(--space-2); align-items: center; padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .track[data-mute] { opacity: 0.6; }
  .track .who { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
  .track .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px var(--space-2); align-items: center; font-size: var(--text-sm); color: var(--fg-2); }
  .track label small { grid-column: 2; font-variant-numeric: tabular-nums; }
  .track label input[type="range"] { width: 100%; min-width: 0; }
  .when { display: flex; gap: var(--space-1); align-items: center; }
  .when input { width: 5.5rem; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; background: #7c9cff; } /* design-ok: one colour per track, the editor's own palette */
  .c1 { background: #ff9e7a; } /* design-ok: one colour per track, the editor's own palette */
  .c2 { background: #6fd3a8; } /* design-ok: one colour per track, the editor's own palette */
  .c3 { background: #e6a1ff; } /* design-ok: one colour per track, the editor's own palette */
  .c4 { background: #ffd36b; } /* design-ok: one colour per track, the editor's own palette */
  .c5 { background: #7ad7ff; } /* design-ok: one colour per track, the editor's own palette */
  .c6 { background: #ff7aa8; } /* design-ok: one colour per track, the editor's own palette */
  .c7 { background: #b5e86b; } /* design-ok: one colour per track, the editor's own palette */
  @media (max-width: 800px) {
    .track { grid-template-columns: minmax(0, 1fr) auto; }
    .track label { grid-column: 1 / -1; }
  }
</style>

<template id="timeline-head">
  <section class="timeline" aria-label="Timeline">
    <h2>Timeline</h2>
    <p class="muted">Clips side by side, as tracks you can still move and re-level: nothing is mixed until you play it or keep it. Drag a track along its lane to move it.</p>
    <div class="row">
      <template if="!noMixes">
        <label>Mix
          <select data-action="open-mix" aria-label="Mix">
            <template for="m of mixes"><option key="{{m.id}}" value="{{m.id}}" selected="{{m.current}}">{{m.name}}</option></template>
          </select>
        </label>
      </template>
      <button type="button" data-action="mix:new">New mix</button>
      <template if="has">
        <form data-action="rename-mix">
          <label>Name <input name="name" value="{{name}}" required></label>
          <button type="submit">Rename</button>
        </form>
      </template>
    </div>
    <template if="has">
      <form data-action="add-track" class="add">
        <label>Clip
          <select name="clip" aria-label="Clip to add as a track">
            <template for="c of clips"><option key="{{c.id}}" value="{{c.id}}">{{c.name}}</option></template>
          </select>
        </label>
        <label>Starts at (s) <input name="at" type="number" min="0" step="0.25" value="0"></label>
        <button type="submit" disabled="{{full}}">Add a track</button>
      </form>
      <div class="row">
        <button type="button" class="play primary" data-action="play-mix" disabled="{{noPlay}}"><template if="playing">■ Stop</template><template if="!playing">▶ Play the mix</template></button>
        <button type="button" data-action="bounce" disabled="{{noTracks}}">Make it a clip</button>
        <span class="muted">{{length}} s</span>
      </div>
    </template>
  </section>
</template>

<template id="timeline-tracks">
  <section aria-label="Tracks">
    <template if="empty"><p class="muted">No tracks yet: add a clip.</p></template>
    <ul class="tracks">
      <template for="t of tracks">
        <li class="track" key="{{t.key}}" data-track="{{t.name}}" data-at="{{t.at}}" data-gain="{{t.gain}}" data-mute="{{t.mute}}">
          <div class="who"><span class="swatch c{{t.n}}"></span><span>{{t.name}}</span><small class="muted">{{t.seconds}} s<template if="t.missing">, not here</template></small></div>
          <div class="when">
            <button type="button" data-action="nudge:{{t.key}}:back" aria-label="Earlier">◀</button>
            <input type="number" min="0" step="0.05" value="{{t.at}}" data-action="track-at:{{t.key}}" aria-label="{{t.name}} starts at (s)">
            <button type="button" data-action="nudge:{{t.key}}:on" aria-label="Later">▶</button>
          </div>
          <label>Level <input type="range" min="0" max="2" step="0.05" value="{{t.gain}}" data-action="track-gain:{{t.key}}" aria-label="{{t.name}}: level"><small>{{t.gainShown}}</small></label>
          <label>Pan <input type="range" min="-1" max="1" step="0.1" value="{{t.pan}}" data-action="track-pan:{{t.key}}" aria-label="{{t.name}}: left to right"><small>{{t.panShown}}</small></label>
          <div class="row">
            <button type="button" data-action="track-mute:{{t.key}}"><template if="t.mute">Unmute</template><template if="!t.mute">Mute</template></button>
            <button type="button" data-action="track-remove:{{t.key}}">Remove</button>
          </div>
        </li>
      </template>
    </ul>
    <p class="status" role="status">{{status}}</p>
  </section>
</template>
